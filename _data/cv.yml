bio_lead:
  en: "I build AI that reads the sounds of the body: lung sounds, cough and voice."
  ko: "몸에서 나는 소리(폐음·기침·목소리)를 읽는 AI를 만듭니다."
bio:
  - en: "My research focuses on models that keep working when the recording device, the patient or the environment changes."
    ko: "녹음 기기나 사람, 주변 환경이 바뀌어도 성능이 유지되는 모델을 연구합니다."
  - en: "I also make these models small enough to run on phones and embedded hardware, and bring them into products as co-founder and CTO of MediSensing."
    ko: "이 모델을 휴대폰과 임베디드 기기에서 돌아갈 만큼 작게 만들고, 메디센싱 공동창업자·CTO로서 제품에 담고 있습니다."

