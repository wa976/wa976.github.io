roles:
  - Ph.D. Candidate, Applied Artificial Intelligence, SEOULTECH
  - Co-Founder & CTO, MediSensing Inc.

bio: >-
  I'm a Ph.D. candidate in Applied Artificial Intelligence at Seoul National University of
  Science and Technology (SEOULTECH), advised by Prof. Seong-Eun Kim, and Co-Founder & CTO
  of MediSensing. I work on body-sound AI: lung sounds, cough and voice. My focus is models
  that keep working when the recording device, the patient or the environment changes, and
  that are small enough to run on phones and embedded hardware.

interests:
  - Body sound analysis (lung sounds, cough, voice)
  - Domain generalization & adaptation for medical audio
  - On-device audio & speech AI
  - Sound event detection
  - Multimodal health AI

