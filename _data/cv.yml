# Rows under the lead line. `items` render as a list; `link` is optional.
research:
  - label: "Main"
    label_ko: "주 연구"
    en: "Respiratory sound analysis that stays reliable when the recording device or the patient changes, from digital stethoscopes to smartphone microphones (domain adaptation and generalization)."
    ko: "녹음 기기나 환자가 바뀌어도 성능이 유지되는 호흡음(폐음) 분석. 디지털 청진기부터 스마트폰 마이크까지 다루며, 도메인 적응·일반화를 연구합니다."
  - label: "Also"
    label_ko: "부 연구"
    items:
      - en: "Low-complexity audio models for on-device use (knowledge distillation)"
        ko: "온디바이스용 경량 오디오 모델 (지식 증류)"
        link: /projects/dcase2025-task1-device-aware-kd/
      - en: "Sound event detection and spatial acoustic imaging"
        ko: "소리 이벤트 탐지·공간 음향 이미징"
        link: /projects/dcase2026-task3-semantic-acoustic-imaging/
      - en: "Voice disorder detection from wearable neck-accelerometer signals"
        ko: "목 가속도계 웨어러블 신호 기반 음성 장애 탐지"
        link: /projects/neckvibe-interspeech2026/
      - en: "Co-authored work on spiking transformers and on speech prosody for VR agents"
        ko: "공동 연구: 스파이킹 트랜스포머, 음성 운율 기반 VR 에이전트"
        link: /#publications

bio:
