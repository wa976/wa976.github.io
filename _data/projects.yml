  blog:
  - h: TL;DR
    h_ko: 요약
    text: '- Dadok is MediSensing''s AI parenting agent for iOS, on the Korean App Store since August 2026.

      - As co-founder and CTO, I set its product direction and lead its AI.

      - I designed and built most of its voice conversation pipeline, now in testing ahead of release.

      - The rule behind it: the LLM makes the choices; code guarantees whatever has to be right.'
    text_ko: '- 다독은 메디센싱이 만든 iOS 육아 AI 에이전트로, 2026년 8월부터 한국 App Store에서 서비스하고 있습니다.

      - 공동창업자·CTO로서 제품 방향을 정하고 AI를 총괄합니다.

      - 지금 출시 전 테스트 중인 음성 대화 파이프라인의 대부분을 직접 설계하고 만들었습니다.

      - 바탕이 된 원칙: 고르는 일은 LLM이 하고, 틀리면 안 되는 것은 코드가 보장합니다.'
  - h: Why Dadok
    h_ko: 왜 만들었나
    text: 'Parents log feeding, sleep and diapers with a baby in one arm, so "I''ll write it down later" often means
      it never gets written. Dadok takes the effort out of logging and turns the records into answers. It is a wellness
      product: no diagnosis, no breathing alerts.'
    text_ko: 아이를 안은 채로는 수유·수면·기저귀를 바로 적기 어렵고, "이따 적어야지" 했던 기록은 자주 빠집니다. 다독은 기록하는 수고를 덜고 쌓인 기록을 답으로 바꿔 줍니다. 진단이나
      호흡 알림은 하지 않는 웰니스 제품입니다.
  - h: What it does today
    h_ko: 지금 할 수 있는 것
    text: '- **Log by voice or one tap.** "시리야, 육아기록!" ("Hey Siri, baby log") plus one sentence like "woke up, changed
      the diaper and fed formula" becomes separate records. Buttons and lock-screen widgets cover the rest.

      - **Ask.** An AI chat answers "when did she last feed?" from the baby''s own records.

      - **Share.** Timelines and weekly rhythms, shared with family through an invite code.'
    text_ko: '- **말이나 탭 한 번으로 기록.** "시리야, 육아기록!" 다음에 "깨서 기저귀 갈고 분유 먹였어"처럼 한 문장으로 말하면 각각 기록됩니다. 나머지는 버튼과 잠금화면 위젯으로
      남깁니다.

      - **묻기.** "마지막 수유가 언제였지?" 같은 질문에 AI 채팅이 우리 아이 기록을 바탕으로 답합니다.

      - **나누기.** 시간순 기록과 주간 리듬을 초대 코드로 연결한 가족과 함께 봅니다.'
  - h: The voice conversation pipeline
    h_ko: 음성 대화 파이프라인
    text: '**speech recognition → end-of-turn detection → safety pre-check → one LLM call with tools → code checks
      → output filter → on-device TTS**


      The iPhone recognizes speech, finds the end of the turn and handles interruptions; Dadok''s server only ever
      receives text. On the server, a code pre-check handles safety cases first, and everything else goes to one
      streaming LLM call that can save a record, look up records or decline an off-topic request. Code validates
      and filters the result, and the iPhone speaks it sentence by sentence.


      I chose a cascade over an end-to-end speech model. With text between the stages, I can measure each stage''s
      errors, trace every saved record to its sentence, enforce safety in code and keep audio off our server. All
      gates share one LLM call, because each extra chained call added 0.8–1.3 s.'
    text_ko: '**음성 인식 → 말 끝 판정 → 안전 사전검사 → 도구를 쓰는 LLM 호출 1회 → 코드 검증 → 출력 필터 → 기기 안 TTS**


      iPhone은 말을 받아쓰고, 말이 끝났는지 판단하고, 끼어들기를 처리합니다. 다독 서버는 텍스트만 받습니다. 서버에서는 안전에 관한 말을 코드 사전검사가 먼저 처리하고, 나머지는 스트리밍
      LLM 호출 한 번으로 갑니다. LLM은 기록 저장, 기록 조회, 육아와 무관한 요청 거절 중에서 도구를 고를 수 있습니다. 그 결과를 코드가 검증하고 걸러 내면, iPhone이 문장 단위로
      읽어 줍니다.


      통합 음성 모델 대신 단계를 나눈 구조를 골랐습니다. 단계 사이가 텍스트라서 단계별 오류를 따로 잴 수 있고, 저장된 기록마다 그 기록을 만든 문장을 추적할 수 있고, 안전 규칙을 코드로 강제할
      수 있고, 음성을 서버에 두지 않을 수 있습니다. 게이트는 LLM 호출 한 번에 모았습니다. 호출을 하나 이어 붙일 때마다 0.8~1.3초가 늘었기 때문입니다.'
  - h: Design decisions and why
    h_ko: 설계 결정과 이유
    text: '**Record gate.** The LLM decides whether a sentence is a log and extracts the fields; the reply is a
      fixed confirmation phrase. Code checks that every number was actually said (the LLM once quietly turned "분유
      이천", formula 2,000, into 200 ml) and that the action is finished ("이제 슬슬 재워야지", "time to put her down", had
      been logged as sleep). Unsure cases get "분유 120ml 기록할까요?" ("Log 120 ml of formula?"). "No, it was 100" edits
      the same record, and Dadok says "saved" only after the app confirms the save.


      **Answers grounded in the records.** The LLM picks a metric, a period and a comparison; code does the arithmetic.
      On 691 synthetic records over 30 days, with 12 derived questions run three times each, the LLM computing from
      raw records scored 22/36, the LLM writing SQL over the raw event table 25/36, and a query spec run by code
      34/36. The wrong answers looked plausible, which made them dangerous.


      **Safety layer.** I first tested LLM assistants already shipping in consumer apps. One blocked "can you diagnose
      this?" but answered the same worry phrased as a symptom, and treated slowly building risks as everyday tips.
      So Dadok has three layers:

      - A code pre-check before the LLM sends dosing, diagnoses, severe emergencies and crisis statements to fixed
      templates. Negations ("no seizure") pass, since Dadok asks about urgent signs one at a time and most answers
      are "no".

      - The LLM answers general questions briefly, asks about the most urgent sign first and ends with a suggestion
      to see a pediatrician, which code adds if it is missing.

      - Before TTS, a code filter rewords risky terms so a warning in the same sentence survives, and drops sentences
      with drug names, diagnoses or "no need to see a doctor".


      **Privacy.** The server gets text, an internal child ID, the age in days and the records a question needs;
      no name, no audio. Logs are text only: home audio carries other people''s voices, and text is enough to find
      misheard words.


      **Evaluation.** 322 scored checks in 16 sets rerun after every change, with holdout sets written before the
      edits they test. I also read the transcripts; that is how I caught leaked internal instructions and the assistant
      assuming the speaker was the mother.'
    text_ko: '**기록 게이트.** 이 말이 기록인지는 LLM이 판단하고 칸을 뽑지만, 답은 정해진 확인 문구로 합니다. 코드는 숫자가 실제로 말한 숫자인지(LLM이 "분유 이천"을 조용히
      200ml로 바꿔 저장한 적이 있습니다), 끝낸 일인지("이제 슬슬 재워야지"가 수면으로 기록된 적이 있습니다) 확인합니다. 애매하면 "분유 120ml 기록할까요?"라고 묻습니다. "아니 100이야"라고
      하면 같은 기록을 고치고, 앱이 저장을 확인한 뒤에만 "기록했어요"라고 말합니다.


      **기록에 근거한 답.** LLM은 지표·기간·비교만 고르고, 계산은 코드가 합니다. 30일치 가상 기록 691건에서 파생 질문 12개를 세 번씩 돌렸더니, LLM이 원본 기록으로 직접 계산하면
      22/36, LLM이 원본 이벤트 테이블에 SQL을 쓰면 25/36, 조회 명세를 코드가 실행하면 34/36이었습니다. 오답이 그럴듯해 보여서 더 위험했습니다.


      **안전 장치.** 먼저 소비자 앱에 이미 들어가 있는 LLM 비서들을 직접 시험했습니다. 한 곳은 "진단해 줄 수 있어?"는 막았지만, 같은 걱정을 증상으로 물으면 답했고, 서서히 커지는
      위험은 생활 팁으로 넘겼습니다. 그래서 다독은 세 겹으로 지킵니다.

      - LLM 전에 코드 사전검사가 약 용량, 진단, 심각한 응급, 위기 발화를 정해진 안내 문구로 보냅니다. 부정한 신호("경련은 없었어")는 걸리지 않습니다. 다독이 급한 신호를 하나씩 묻기
      때문에 부모의 답은 대개 "아니"입니다.

      - 일반 질문에는 LLM이 짧게 답하고, 가장 급한 신호부터 묻고, 소아청소년과 진료 권유로 마무리합니다. 권유가 빠지면 코드가 붙입니다.

      - TTS 전에는 코드 필터가 위험한 단어를 바꿔 써서 같은 문장의 경고가 함께 사라지지 않게 하고, 약 이름·진단·"병원 안 가도 돼요"가 든 문장은 뺍니다.


      **프라이버시.** 서버가 받는 것은 텍스트, 아이의 내부 ID, 생후일수, 질문에 필요한 기록뿐입니다. 이름과 원음은 받지 않습니다. 로그도 텍스트만 남깁니다. 집 안의 소리에는 다른 사람의
      목소리가 섞이고, 잘못 알아듣는 단어는 텍스트로도 충분히 찾을 수 있기 때문입니다.


      **평가.** 16개 평가셋, 채점 항목 322개를 고칠 때마다 다시 돌리고, 홀드아웃 셋은 그 셋으로 확인할 수정보다 먼저 썼습니다. 대화 전문도 읽습니다. 내부 지시가 답에 새어 나온 것과
      말하는 사람을 엄마로 단정한 것을 그렇게 찾았습니다.'
  - h: On-device voice
    h_ko: 기기 안 음성 합성
    text: 'Replies are text anyway, so speech can be synthesized on the phone without a speech server. I integrated
      an open-source, non-autoregressive TTS model that scored a predicted MOS (UTMOS) of 4.03 on 158 Dadok sentences,
      against 2.50 for the app''s previous system voice. It runs on the CPU, since iOS allows no GPU use in the
      background and conversations continue with the screen locked.

      - **Profile first.** One generator network took 93–98% of synthesis time, and 92% of its weights were 1×1
      convolutions.

      - **"int8 is faster" was wrong.** Dynamic int8 ran 2.6× slower. Full static int8 ran 2.4× faster, but naturalness
      fell from 4.05 to 2.64. Static int8 on the 1×1 convolutions only gave about 2.3× at 3.75, and 398 MB became
      127 MB.

      - **Two threads beat all six cores** on an iPhone 16. The first sentence now takes about 0.3 s, down from
      0.6 s.

      - **The 1.1-second gap** between sentences was digital silence the model adds. Trimming it gave 0.3 s gaps
      and a first sound 0.5 s sooner, and showed that my "first sound" metric had been measured before that silence.'
    text_ko: '답은 어차피 텍스트라서 음성 서버 없이 폰에서 합성할 수 있습니다. 오픈소스 비자기회귀 TTS 모델을 앱에 넣었고, 다독 문장 158개에서 예측 MOS(UTMOS) 4.03으로
      앱이 쓰던 시스템 음성(2.50)보다 높았습니다. iOS는 백그라운드에서 GPU를 쓸 수 없고 대화는 화면을 잠가도 이어져야 하므로 CPU에서 돌립니다.

      - **먼저 프로파일.** 생성기 네트워크 하나가 합성 시간의 93~98%를 썼고, 그 가중치의 92%가 1×1 합성곱이었습니다.

      - **"int8이면 빨라진다"는 틀렸습니다.** 동적 int8은 2.6배 느려졌습니다. 전부 정적 int8로 하면 2.4배 빨라졌지만 자연스러움이 4.05에서 2.64로 떨어졌습니다. 1×1
      합성곱만 정적 int8로 하자 약 2.3배 빨라지면서 3.75를 지켰고, 크기는 398MB에서 127MB가 됐습니다.

      - **코어 6개보다 스레드 2개.** iPhone 16에서는 2스레드가 모든 코어를 쓰는 것보다 빨랐습니다. 첫 문장 합성은 0.6초에서 약 0.3초가 됐습니다.

      - **문장 사이 1.1초 공백**은 모델이 붙이는 디지털 무음이었습니다. 잘라 내니 공백은 0.3초, 첫 소리는 0.5초 빨라졌고, 제 "첫 소리" 지표가 이 무음 앞에서 재고 있었다는 것도
      드러났습니다.'
  - h: Making it work in daily use
    h_ko: 매일 쓰는 앱으로 다듬기
    text: '- **Latency, stage by stage.** In an early measurement on a development build (seven conversations, iPhone
      16), end of speech to first sound averaged 2.3 s against my 1.5 s median target. The LLM''s first sentence
      took 59%, speech-recognition finalization 27% and TTS 14%, so the next cuts go to the LLM and end-of-turn
      detection.

      - **End of turn.** The silence window follows how the partial transcript ends: 400 ms after a sentence ending
      ("먹였어"), 1,600 ms after a particle ("분유를"), 700 ms otherwise. After 250 ms of silence the partial transcript
      goes ahead so the LLM starts early; nothing is saved before the turn is confirmed.

      - **Interruptions.** Overlapping speech dips the volume after 200 ms, and real words stop playback. Dadok
      ignores its own echo, stops on "잠깐" (wait) and talks through backchannels like "네네", which are everywhere
      in Korean conversation.

      - **Getting in, staying on.** "시리야, 다독" or a widget opens straight into listening. A dropped connection resumes
      with its context, and if a save is uncertain, Dadok asks the parent to check the list rather than risk a duplicate.'
    text_ko: '- **단계별 지연.** 개발 빌드 초기 측정(iPhone 16, 대화 7번)에서 말 끝부터 첫 소리까지 평균 2.3초로, 제가 정한 목표(중앙값 1.5초)보다 길었습니다. LLM
      첫 문장이 59%, 받아쓰기 확정이 27%, TTS가 14%였으므로 다음에 줄일 곳은 LLM과 말 끝 판정입니다.

      - **말 끝 판정.** 기다리는 무음 길이를 부분 전사의 끝말로 정합니다. "먹였어"처럼 끝맺으면 400ms, "분유를"처럼 조사로 끝나면 1,600ms, 그 밖에는 700ms입니다. 250ms
      조용하면 부분 전사를 먼저 보내 LLM을 일찍 돌리고, 말 끝이 확정되기 전에는 아무것도 저장하지 않습니다.

      - **끼어들기.** 말이 겹치면 200ms 뒤 볼륨을 낮추고, 실제 단어가 들어와야 재생을 멈춥니다. 자기 목소리의 에코는 무시하고, "잠깐"에는 멈추고, 한국어 대화에 늘 나오는 "네네"
      같은 맞장구에는 계속 말합니다.

      - **들어가기와 이어 가기.** "시리야, 다독"이나 위젯으로 바로 듣기 화면이 열립니다. 연결이 끊겼다 이어지면 대화 맥락도 이어지고, 저장됐는지 확실하지 않으면 중복을 만들지 않도록 기록
      목록을 확인하라고 안내합니다.'
  - h: What I did
    h_ko: 제가 한 일
    text: '- Product direction as co-founder and CTO, including the wellness boundary and the safety lines.

      - AI lead: the voice conversation architecture, component choices and evaluation.

      - Built, mostly hands-on: the conversation server (safety pre-check, tool calling, record validation and editing,
      record lookups, output filter), the evaluation suite, latency instrumentation, on-device TTS and voice selection,
      turn-taking, Siri and widget entry, conversation with the screen locked, network-failure handling and the
      first greeting.

      - The MediSensing team builds and runs the app together.'
    text_ko: '- 공동창업자·CTO로서 제품 방향을 정했습니다. 웰니스 범위와 안전 금지선도 여기에 들어갑니다.

      - AI를 총괄했습니다: 음성 대화 구조 설계, 구성 요소 선택, 평가.

      - 대부분 직접 만든 것: 대화 서버(안전 사전검사, 도구 호출, 기록 검증·고치기, 기록 조회, 출력 필터), 평가셋, 지연 측정, 기기 안 TTS와 목소리 고르기, 말 주고받기, Siri·위젯
      진입, 화면을 잠가도 이어지는 대화, 네트워크 실패 처리, 첫 인사.

      - 앱 개발과 운영은 메디센싱 팀이 함께 합니다.'
  - h: Grand Prize
    h_ko: 대상 수상
    fig: 2
    text: Dadok is also the item of SoundCare, the graduate startup club I lead in SEOULTECH's 2026 BIZ-Lab program.
      On September 14, 2026, at Kangwon National University, we pitched Dadok at the startup competition of the
      2026 Lab-Specialized Startup-Leading University graduate student startup club program and received the Grand
      Prize.
    text_ko: 다독은 제가 팀 대표를 맡은 서울과기대 2026 BIZ-Lab 대학원생 창업동아리 사운드케어의 아이템이기도 합니다. 2026년 9월 14일 강원대학교에서 열린 2026 실험실특화형
      창업선도대학 대학원생 창업동아리 역량강화 프로그램 창업경진대회에서 다독을 발표해 대상을 받았습니다.
