  blog:
  - h: TL;DR
    h_ko: 한 줄 요약
    text: PC-MCL trains a lung-sound classifier on pairs of concatenated breathing cycles. To make this work, I
      replaced the usual 2-label target with a 3-label `[normal, crackle, wheeze]` target and added a head that
      predicts whether the two cycles come from the same patient. On the ICBHI 2017 4-class benchmark (official
      split, five seeds), BEATs + PC-MCL reaches an ICBHI Score of **65.37%**, the highest among the methods compared
      in the paper.
    text_ko: PC-MCL은 호흡 주기 두 개를 이어 붙인 입력으로 폐음 분류기를 학습합니다. 이 방식이 제대로 작동하도록 흔히 쓰는 2-라벨 타깃을 3-라벨 `[normal, crackle,
      wheeze]` 타깃으로 바꾸고, 두 주기가 같은 환자에게서 나왔는지 맞히는 헤드를 더했습니다. ICBHI 2017 4-클래스 벤치마크(공식 분할, 시드 5개)에서 BEATs + PC-MCL의
      ICBHI Score는 **65.37%**, 논문에서 비교한 방법 중 가장 높은 값입니다.
  - h: The problem
    h_ko: 문제
    text: 'ICBHI 2017 asks a model to classify each respiratory cycle as Normal, Crackle, Wheeze or Both. Many models
      have two limits:


      - **Single-cycle view.** Abnormal sounds are often transient and intermittent; one cycle gives little temporal
      context around a brief event.

      - **Patient-specific overfitting.** Models learn superficial patient acoustics instead of the pathology, the
      issue I targeted in PAFA.


      Concatenating cycles adds context, and earlier work (RespireNet, Wang et al.) joined same-class cycles. Mixing
      normal with abnormal is where I found a labeling problem. In the common 2-label `[crackle, wheeze]` scheme
      a normal cycle is `[0, 0]`, so normal + crackle `[1, 0]` is labeled `[1, 0]`, exactly like pure crackle. I
      call this the **multi-label distributional bias**: concatenation systematically erases normal information
      from mixed samples.'
    text_ko: 'ICBHI 2017은 호흡 주기 하나하나를 Normal, Crackle(수포음), Wheeze(천명음), Both 중 하나로 분류하는 과제입니다. 많은 모델에 두 가지 한계가
      있습니다.


      - **주기 하나만 봅니다.** 이상음은 잠깐 나타나거나 간헐적인 경우가 많아서, 주기 하나로는 짧은 사건 주변의 시간적 맥락을 보기 어렵습니다.

      - **환자 고유 특성에 과적합합니다.** 병리 대신 개별 환자의 표면적인 음향을 배웁니다. 제가 PAFA에서 다룬 문제입니다.


      주기를 이어 붙이면 맥락을 넣을 수 있고, RespireNet, Wang et al. 같은 이전 연구도 같은 클래스 주기를 이어 붙였습니다. 저는 정상과 이상을 섞는 지점에서 라벨 문제를 발견했습니다.
      흔히 쓰는 2-라벨 `[crackle, wheeze]` 방식에서 정상 주기는 `[0, 0]`이므로, 정상 + crackle `[1, 0]`의 라벨은 `[1, 0]`이 되어 순수 crackle과
      똑같아집니다. 저는 이것을 **다중 라벨 분포 편향**(multi-label distributional bias)이라고 부릅니다. 이어 붙이기가 섞인 샘플에서 정상 정보를 체계적으로 지웁니다.'
  - h: Key idea
    h_ko: 핵심 아이디어
    text: 'Three components, one per issue:


      1. **Multi-cycle concatenation** adds temporal context, including normal+abnormal mixes.

      2. **A 3-label formulation** removes the bias: normal gets its own label, so a normal+crackle mix becomes
      `[1, 1, 0]` and keeps both halves.

      3. **A patient-matching auxiliary task** acts as a regularizer: the model also predicts whether the two cycles
      come from the same patient.'
    text_ko: '구성 요소 세 가지가 위 문제를 하나씩 맡습니다.


      1. **다중 주기 연결**(multi-cycle concatenation)로 정상+이상 조합까지 포함한 시간적 맥락을 넣습니다.

      2. **3-라벨 방식**으로 편향을 없앱니다. 정상에 독립된 라벨을 주면 정상+crackle 조합은 `[1, 1, 0]`이 되어 양쪽 정보가 모두 남습니다.

      3. **환자 일치(patient-matching) 보조 과제**가 정규화 역할을 합니다. 두 주기가 같은 환자의 것인지도 함께 예측하게 합니다.'
  - h: How it works
    h_ko: 방법
    text: '**Inputs.** For every original training sample I generate one concatenated sample: a same-class or cross-class
      pair, from the same patient or different patients. Each cycle is repeat-padded or center-cropped to half of
      a 10-second input.


      **Labels.** The element-wise OR of the two 3-label vectors, trained with multi-label binary cross-entropy.


      **One backbone, two heads.** A shared encoder (BEATs or AST) feeds two projection heads: one predicts the
      3-label vector, the other predicts same vs. different patient (cross-entropy, weight 0.1 from a grid search
      on the validation set). The negatives are hard: the different-patient partner has the same pathology classes,
      which forces the model to separate pathology cues from patient signatures.


      **Back to four classes.** Each test cycle is padded or truncated to 10 seconds and the outputs are thresholded
      at 0.5: crackle and wheeze together map to Both, either alone to its class, neither to Normal. Training on
      pairs and testing on single cycles is a slight domain shift, but it was robust in practice.


      **Front end.** 16 kHz audio, 128-dimensional Mel spectrograms (25 ms window, 10 ms shift).'
    text_ko: '**입력.** 원래 학습 샘플마다 이어 붙인 샘플을 하나씩 만듭니다. 같은 클래스 쌍이나 다른 클래스 쌍을, 같은 환자 안에서도 다른 환자 사이에서도 만듭니다. 각 주기는 10초
      입력의 절반에 맞춰 반복 패딩하거나 가운데를 잘라 냅니다.


      **라벨.** 두 3-라벨 벡터의 원소별 OR이고, 다중 라벨 이진 교차 엔트로피로 학습합니다.


      **백본 하나, 헤드 두 개.** 공유 인코더(BEATs 또는 AST) 뒤의 프로젝션 헤드 두 개 중 하나는 3-라벨 벡터를, 다른 하나는 같은 환자인지 다른 환자인지를 예측합니다(교차 엔트로피,
      검증 세트 그리드 서치로 정한 가중치 0.1). 음성 쌍은 hard negative입니다. 다른 환자 쪽 짝을 병리 클래스가 같은 환자에게서 고르므로, 모델은 병리 단서와 환자 고유 특징을
      분리해야 합니다.


      **다시 4-클래스로.** 테스트 주기는 하나씩 10초에 맞게 패딩하거나 자르고 출력을 0.5로 임계 처리합니다. crackle과 wheeze가 함께 나오면 Both, 하나만 나오면 해당 클래스,
      둘 다 없으면 Normal입니다. 쌍으로 학습하고 단일 주기로 테스트하므로 약간의 도메인 차이가 있지만, 실제로는 안정적으로 작동했습니다.


      **전처리.** 16 kHz 오디오, 128차원 Mel 스펙트로그램(25 ms 윈도, 10 ms 프레임 이동)을 씁니다.'
  - h: Experiments and results
    h_ko: 실험과 결과
    text: 'ICBHI 2017, official 60:40 split, challenge metrics: Specificity (Sp), Sensitivity (Se) and their mean,
      the ICBHI Score. All numbers are means over five random seeds.


      - **BEATs + PC-MCL: Score 65.37%** (Sp 79.04%, Se 51.71%), above every method in the paper''s Table 1, including
      my earlier PAFA (64.84%).

      - Against cross-entropy (CE) on the same backbone, the Score goes from 62.82% to 65.37% on BEATs and from
      59.55% to 62.30% on AST.

      - Sensitivity, the metric for catching abnormal cycles, gains the most: +2.92 points on BEATs and +4.08 on
      AST.'
    text_ko: 'ICBHI 2017 공식 60:40 분할에서 챌린지 지표인 특이도(Sp), 민감도(Se), 그리고 둘의 평균인 ICBHI Score로 평가했습니다. 모든 수치는 랜덤 시드 5개의
      평균입니다.


      - **BEATs + PC-MCL: Score 65.37%**(Sp 79.04%, Se 51.71%). 제 이전 연구 PAFA(64.84%)를 포함해 논문 Table 1의 모든 방법보다 높습니다.

      - 같은 백본의 교차 엔트로피(CE)와 비교하면 Score가 BEATs에서 62.82%에서 65.37%로, AST에서 59.55%에서 62.30%로 오릅니다.

      - 가장 크게 오른 지표는 이상 주기를 잡아내는 민감도입니다. BEATs에서 +2.92포인트, AST에서 +4.08포인트입니다.'
    table: 1
  - h: Ablations
    h_ko: 어블레이션
    text: 'Adding components one at a time on BEATs (CE: 62.82%):


      - **3-label alone:** Se +2.31 points, but Sp falls from 76.85% to 73.10%, so the Score is 62.10%.

      - **Concatenation alone:** 64.19%, the largest single gain (+1.37).

      - **Concatenation + 3-label:** 64.28%, with the highest Se (51.91%).

      - **+ patient matching:** Sp 79.04%, Score 65.37%.


      Two targeted checks:


      - **2-label vs. 3-label:** 60.42% vs. 65.37%. The 2-label model has higher raw Se (61.98%), but Sp drops to
      58.86% (±9.59 across seeds), because any sample containing a normal cycle is labeled purely abnormal.

      - **Hard vs. base negatives:** +0.61 points (64.76% to 65.37%).


      In the t-SNE below, 2-label training puts mixed normal+wheeze samples on top of pure wheeze+wheeze samples;
      3-label training separates them.'
    text_ko: 'BEATs(CE 62.82%)에 구성 요소를 하나씩 더했습니다.


      - **3-라벨만:** Se는 2.31포인트 오르지만 Sp가 76.85%에서 73.10%로 떨어져 Score는 62.10%입니다.

      - **연결만:** 64.19%로, 단일 요소 중 가장 크게 올립니다(+1.37).

      - **연결 + 3-라벨:** 64.28%이고, Se가 가장 높습니다(51.91%).

      - **+ 환자 일치:** Sp 79.04%, Score 65.37%입니다.


      설계 선택만 떼어 본 실험도 두 가지 했습니다.


      - **2-라벨 vs 3-라벨:** 60.42% 대 65.37%입니다. 2-라벨 모델은 Se 자체는 더 높지만(61.98%) Sp가 58.86%로 떨어지고 시드 간 편차도 큽니다(±9.59).
      정상 주기가 섞인 샘플이 모두 순수한 이상으로 라벨링되기 때문입니다.

      - **Hard vs base 음성 샘플:** +0.61포인트(64.76%에서 65.37%로)입니다.


      아래 t-SNE에서 2-라벨로 학습하면 정상+wheeze 혼합 샘플이 wheeze+wheeze 순수 샘플과 겹치고, 3-라벨로 학습하면 둘이 분리됩니다.'
    fig: 2
  - h: A threshold-free check
    h_ko: 임계값 없이 본 성능
    text: 'The ICBHI Score depends on the threshold and the conversion rule, and the data are imbalanced, so I also
      compared per-class precision-recall curves. Average precision for crackle and wheeze (mean of five runs):


      - **CE baseline:** 0.209 and 0.116. It barely learns the abnormal classes.

      - **Intermediate multi-label model:** 0.600 and 0.650. Modeling pathologies as co-occurring events matters
      most.

      - **Full PC-MCL:** 0.642 and 0.663.'
    text_ko: 'ICBHI Score는 임계값과 변환 규칙에 따라 달라지고 데이터의 클래스 불균형도 심해서, 클래스별 precision-recall 곡선도 비교했습니다. crackle과 wheeze의
      average precision(시드 5개 평균)은 다음과 같습니다.


      - **CE 베이스라인:** 0.209, 0.116. 이상 클래스를 거의 배우지 못합니다.

      - **중간 단계 다중 라벨 모델:** 0.600, 0.650. 병리를 함께 나타날 수 있는 사건으로 모델링하는 것이 가장 중요합니다.

      - **전체 PC-MCL:** 0.642, 0.663.'
    fig: 3
  - h: What I did
    h_ko: 내가 한 일
    text: '- Identified the multi-label distributional bias and designed the 3-label correction.

      - Designed the framework: pair construction, the patient-matching head with hard negatives, and the multi-label-to-4-class
      rule.

      - Implemented it on AST and BEATs and ran every experiment over five seeds.

      - Ran the ablations and the t-SNE and precision-recall analyses.

      - Wrote the paper (IEEE ICASSP 2026, first author).'
    text_ko: '- 다중 라벨 분포 편향을 찾아내고 3-라벨 방식으로 바로잡았습니다.

      - 쌍 구성, hard negative를 쓰는 환자 일치 헤드, 다중 라벨에서 4-클래스로 바꾸는 규칙까지 프레임워크를 설계했습니다.

      - AST와 BEATs에 구현하고, 모든 실험을 시드 5개로 돌렸습니다.

      - 어블레이션과 t-SNE, precision-recall 분석을 수행했습니다.

      - 논문을 썼습니다(IEEE ICASSP 2026, 제1저자).'
  - h: Takeaways and limits
    h_ko: 배운 점과 한계
    text: '- **Augmentation can change what a label means.** Concatenation helps only if the label space can describe
      the mix.

      - **Normal deserves its own label.** It gives a more balanced supervision signal and a higher Score than 2
      labels.

      - **Limits.** Training on pairs and testing on single cycles is a slight domain shift. All results come from
      one benchmark, ICBHI 2017.'
    text_ko: '- **증강은 라벨의 의미를 바꿀 수 있습니다.** 이어 붙이기는 라벨 공간이 섞인 내용을 표현할 수 있을 때만 도움이 됩니다.

      - **정상에도 자기 라벨이 필요합니다.** 감독 신호가 더 균형 잡히고, 라벨 2개일 때보다 높은 Score를 얻습니다.

      - **한계.** 쌍으로 학습하고 단일 주기로 테스트하므로 약간의 도메인 차이가 있습니다. 모든 결과는 ICBHI 2017 벤치마크 하나에서 얻었습니다.'
