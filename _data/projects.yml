    caption: 't-SNE of training embeddings with PAFA: additional sub-clusters appear, so some patient groups are
      no longer absorbed into a single class cluster.'
    caption_ko: 'PAFA를 쓴 학습 임베딩의 t-SNE: 하위 군집이 추가로 나타나, 일부 환자 그룹이 더 이상 하나의 클래스 군집에 흡수되지 않습니다.'
  thumb: /assets/img/projects/pafa-interspeech2025/1-model.webp
  blog:
  - h: TL;DR
    h_ko: 한 줄 요약
    text: PAFA adds two patient-aware losses to a BEATs lung-sound classifier. One keeps each patient's embeddings
      together and apart from other patients; the other anchors all patients to a shared center. On ICBHI 2017 (official
      split, five seeds) it reaches ICBHI Scores of **64.84%** (4-class) and **72.08%** (2-class) without metadata,
      state-of-the-art among the methods compared in the paper. The extra head is dropped after training, so inference
      runs a plain BEATs classifier.
    text_ko: PAFA는 BEATs 폐음 분류기에 환자를 고려한 손실 두 개를 더합니다. 하나는 각 환자의 임베딩을 모으고 다른 환자와는 떨어뜨리며, 다른 하나는 모든 환자를 공통 중심에 묶어
      둡니다. ICBHI 2017(공식 분할, 시드 5개)에서 메타데이터 없이 ICBHI Score **64.84%**(4-클래스), **72.08%**(2-클래스)를 기록했고, 논문에서 비교한
      방법 중 state-of-the-art입니다. 추가 헤드는 학습이 끝나면 떼어 내므로 추론에는 일반 BEATs 분류기만 씁니다.
  - h: The problem
    h_ko: 문제
    text: 'Patients with the same condition can sound very different because of anatomy, disease severity and recording
      environment. ICBHI 2017 has this built in: 6,898 samples from 126 subjects, sampling rates from 4 kHz to 44.1
      kHz, and a skewed class mix (training set: 2,063 Normal, 1,215 Crackle, 501 Wheeze, 363 Both).


      Two common responses fall short:


      - **A global objective takes over.** When cross-entropy dominates, embeddings of distinctive patients converge
      into a few large class clusters. This is **feature collapse**: the model handles well-represented profiles
      and neglects outlier patients.

      - **Metadata is not enough.** Age or gender cannot fully account for the acoustic differences in clinical
      recordings.


      The collapse is visible in a CE-only BEATs model: four large clusters aligned with the four classes.'
    text_ko: '같은 질환을 가진 환자라도 신체 구조, 질병 중증도, 녹음 환경에 따라 소리가 크게 다를 수 있습니다. ICBHI 2017에도 이 문제가 그대로 있습니다. 피험자 126명의 샘플
      6,898개로, 샘플링 레이트가 4 kHz에서 44.1 kHz까지 다양하고 클래스 분포도 치우쳐 있습니다(학습 세트: Normal 2,063, Crackle 1,215, Wheeze 501,
      Both 363).


      흔히 쓰는 두 가지 대응은 충분하지 않습니다.


      - **전역 목적 함수가 학습을 주도합니다.** 교차 엔트로피가 주도하면 특성이 뚜렷한 환자의 임베딩이 몇 개의 큰 클래스 군집으로 모입니다. 이것이 **특징 붕괴**(feature collapse)입니다.
      모델은 데이터에 많은 유형은 잘 다루지만 이례적인 환자는 놓칩니다.

      - **메타데이터로는 부족합니다.** 나이나 성별로는 임상 녹음의 음향 차이를 모두 설명할 수 없습니다.


      CE만으로 학습한 BEATs에서 붕괴가 보입니다. 네 클래스에 맞춰 큰 군집 4개가 생깁니다.'
    fig: 2
  - h: Key idea
    h_ko: 핵심 아이디어
    text: 'Use the patient ID as a training signal, the way Fisher''s linear discriminant analysis uses class labels,
      and balance it with a global anchor:


      - **PCSL (Patient Cohesion-Separation Loss)** makes each patient compact and pushes patients apart, so less-represented
      patients keep their own region.

      - **GPAL (Global Patient Alignment Loss)** pulls every patient centroid toward a common center so the space
      does not fragment.


      PCSL alone might over-separate patients; GPAL alone could over-mix them.'
    text_ko: 'Fisher 선형 판별 분석이 클래스 라벨을 쓰는 방식으로 환자 ID를 학습 신호로 쓰고, 전역 기준점으로 균형을 잡습니다.


      - **PCSL**(Patient Cohesion-Separation Loss)은 환자마다 임베딩을 모으고 환자끼리는 떨어뜨려, 데이터가 적은 환자도 자기 영역을 유지하게 합니다.

      - **GPAL**(Global Patient Alignment Loss)은 모든 환자 중심을 공통 중심 쪽으로 당겨 특징 공간이 조각나지 않게 합니다.


      PCSL만 쓰면 환자가 지나치게 흩어질 수 있고, GPAL만 쓰면 지나치게 섞일 수 있습니다.'
  - h: How it works
    h_ko: 방법
    text: '**Architecture.** An AudioSet-pretrained BEATs encoder feeds a classification head (cross-entropy) and
      a projection head that carries the two patient-aware losses, trained end to end.


      **PCSL.** In each batch, I group projected embeddings by patient. Within-patient scatter is the sum of squared
      distances from each sample to its patient centroid; between-patient dispersion is the sum of squared distances
      between pairs of patient centroids. PCSL is their ratio, which is Fisher''s criterion with "class" replaced
      by "patient". Minimizing it tightens each patient and spreads patients apart.


      **GPAL.** The global centroid is the mean of the patient centroids in the batch; GPAL is the average squared
      distance from each patient centroid to it. It keeps clusters from drifting until the class structure breaks,
      and gives unseen patients a common reference.


      **Weights.** Loss = cross-entropy + 50 × PCSL + 0.0005 × GPAL, set by grid search. Because the two losses
      pull in opposite directions, this balance matters.


      **Training-only.** Patient IDs are used only for the two losses. The projection head is removed after training.


      **Setup.** 16 kHz audio, 5-second segments, 128-bin fbank features; Adam (learning rate 5e-5, weight decay
      1e-6), 100 epochs, batch size 32.'
    text_ko: '**구조.** AudioSet으로 사전학습한 BEATs 인코더 뒤에 분류 헤드(교차 엔트로피)와 환자 인지 손실 두 개를 계산하는 프로젝션 헤드를 두고, end-to-end로
      학습합니다.


      **PCSL.** 배치마다 프로젝션된 임베딩을 환자별로 묶습니다. 환자 내 산포는 각 샘플과 그 환자 중심 사이 거리 제곱의 합이고, 환자 간 분산은 환자 중심 쌍 사이 거리 제곱의 합입니다.
      PCSL은 둘의 비율로, Fisher 기준에서 "클래스"를 "환자"로 바꾼 형태입니다. 이 값을 줄이면 환자마다 임베딩이 촘촘해지고 환자끼리는 멀어집니다.


      **GPAL.** 전역 중심은 배치 안 환자 중심들의 평균이고, GPAL은 각 환자 중심과 전역 중심 사이 거리 제곱의 평균입니다. 군집이 클래스 구조가 깨질 만큼 흩어지지 않게 하고, 처음
      보는 환자에게도 공통 기준점을 줍니다.


      **가중치.** 손실 = 교차 엔트로피 + 50 × PCSL + 0.0005 × GPAL이며, 그리드 서치로 정했습니다. 두 손실이 반대 방향으로 작용하므로 이 균형이 중요합니다.


      **학습 때만 사용.** 환자 ID는 두 손실을 계산할 때만 씁니다. 프로젝션 헤드는 학습이 끝나면 떼어 냅니다.


      **설정.** 16 kHz 오디오, 5초 구간, 128-bin fbank 특징을 쓰고, Adam(learning rate 5e-5, weight decay 1e-6)으로 100 epoch,
      배치 크기 32로 학습합니다.'
  - h: Experiments and results
    h_ko: 실험과 결과
    text: 'ICBHI 2017, official 60/40 split, 4-class and 2-class (Normal vs. Abnormal) tasks; Sp, Se and their mean,
      the ICBHI Score; five seeds.


      - **4-class: 64.84%** (Sp 82.05%, Se 47.63%), +1.35 points over BEATs + CE (63.49%). The strongest prior method
      in the table, BTS (63.54%), uses metadata; PAFA does not.

      - **2-class: 72.08%**, +1.32 points over BEATs + CE (70.76%), ahead of SG-SCL (68.93%).

      - **Other backbones:** CNN6 57.46% to 57.87%, AST 60.93% to 62.19%.

      - **Ablation:** without PCSL 63.92%, without GPAL 63.88%. Each partial version still beats CE, and only the
      pair reaches 64.84%.


      The gain comes from different places per task. On 4-class, Se (47.63%) is slightly below CE (48.21%); the
      gain is in Sp (78.77% to 82.05%), and the Score varies less across seeds (±0.60 vs. ±1.08). On 2-class, Se
      rises from 66.34% to 68.29%.'
    text_ko: 'ICBHI 2017 공식 60/40 분할에서 4-클래스와 2-클래스(Normal 대 Abnormal) 과제를 Sp, Se, 그리고 둘의 평균인 ICBHI Score로 평가했습니다.
      시드 5개 평균입니다.


      - **4-클래스: 64.84%**(Sp 82.05%, Se 47.63%). BEATs + CE(63.49%)보다 1.35포인트 높습니다. 표에서 가장 강한 이전 방법인 BTS(63.54%)는
      메타데이터를 쓰지만 PAFA는 쓰지 않습니다.

      - **2-클래스: 72.08%**. BEATs + CE(70.76%)보다 1.32포인트 높고 SG-SCL(68.93%)을 앞섭니다.

      - **다른 백본:** CNN6는 57.46%에서 57.87%로, AST는 60.93%에서 62.19%로 오릅니다.

      - **어블레이션:** PCSL을 빼면 63.92%, GPAL을 빼면 63.88%입니다. 한쪽만 써도 CE보다는 높지만, 둘을 함께 써야 64.84%에 이릅니다.


      성능이 오르는 곳은 과제마다 다릅니다. 4-클래스에서 Se(47.63%)는 CE(48.21%)보다 조금 낮고, 상승은 Sp(78.77%에서 82.05%로)에서 나오며 시드 간 Score 편차도
      줄어듭니다(±1.08에서 ±0.60으로). 2-클래스에서는 Se가 66.34%에서 68.29%로 오릅니다.'
    table: 1
  - h: Inside the embedding space
    h_ko: 임베딩 공간 들여다보기
    text: '- With PAFA, extra sub-clusters appear in the training t-SNE (below): some patient groups are no longer
      absorbed into a class cluster. Under CE-only they merge into it.

      - Patients with the most recordings stay in the main class clusters under both CE and PAFA, presumably because
      their abundant data already gives them a robust representation.

      - Among the six test patients closest to the new sub-clusters, some drop slightly under PAFA and others improve
      by a large margin. Test patients close to high-sample patients change only slightly.'
    text_ko: '- PAFA를 쓰면 학습 데이터 t-SNE(아래)에 하위 군집이 추가로 나타나, 일부 환자 그룹이 더 이상 클래스 군집에 흡수되지 않습니다. CE만 쓰면 이 환자들이 클래스 군집에
      합쳐집니다.

      - 녹음이 가장 많은 환자들은 CE에서도 PAFA에서도 주요 클래스 군집 안에 남습니다. 데이터가 많아 어느 쪽이든 이미 표현이 충분히 학습되기 때문으로 보입니다.

      - 새 하위 군집에 가장 가까운 테스트 환자 6명 중에는 PAFA에서 조금 떨어지는 환자도, 크게 오르는 환자도 있습니다. 샘플이 많은 환자에 가까운 테스트 환자들은 변화가 작습니다.'
    fig: 3
  - h: What I did
    h_ko: 내가 한 일
    text: '- Framed inter-patient variability as a patient-level feature-collapse problem and designed PCSL and
      GPAL, moving Fisher''s criterion from classes to patients.

      - Implemented PAFA on BEATs and ported it to CNN6 and AST.

      - Tuned the loss weights and ran every experiment over five seeds on both tasks.

      - Ran the ablations and the embedding and per-patient analyses.

      - Released the code at [github.com/wa976/PAFA](https://github.com/wa976/PAFA) and wrote the paper (INTERSPEECH
      2025, first author).'
    text_ko: '- 환자 간 차이를 환자 단위의 특징 붕괴 문제로 정의하고, Fisher 기준을 클래스에서 환자로 옮겨 PCSL과 GPAL을 설계했습니다.

      - PAFA를 BEATs에 구현하고 CNN6와 AST로 옮겼습니다.

      - 손실 가중치를 정하고, 두 과제 모두 모든 실험을 시드 5개로 돌렸습니다.

      - 어블레이션, 임베딩 분석, 환자별 분석을 수행했습니다.

      - 코드를 [github.com/wa976/PAFA](https://github.com/wa976/PAFA)에 공개하고 논문을 썼습니다(INTERSPEECH 2025, 제1저자).'
  - h: Takeaways and limits
    h_ko: 배운 점과 한계
    text: '- **Patient identity is useful supervision for a pathology task,** and it is needed only during training.

      - **Cohesion needs a counterweight.** In the ablation, each loss alone falls short of the pair.

      - **Limits.** On 4-class the gain is in Specificity, some test patients get slightly worse, and results are
      on ICBHI 2017 only. The paper''s next step is dynamic adaptation to unseen patients, updated in real time.

      - **Next.** In PC-MCL (ICASSP 2026) I tackled patient-specific overfitting again, with a patient-matching
      auxiliary task and context across breathing cycles.'
    text_ko: '- **환자 정보는 병리 분류에도 쓸모 있는 감독 신호이고,** 학습할 때만 필요합니다.

      - **응집에는 균형추가 필요합니다.** 어블레이션에서 두 손실 중 하나만 쓰면 둘을 함께 쓸 때보다 낮았습니다.

      - **한계.** 4-클래스에서는 특이도가 오른 것이고, 일부 테스트 환자는 성능이 조금 떨어지며, 결과는 ICBHI 2017에서만 얻었습니다. 논문에서 밝힌 다음 단계는 처음 보는 환자에게
      동적으로 적응하고 실시간으로 갱신하는 것입니다.

      - **다음 연구.** PC-MCL(ICASSP 2026)에서는 환자 일치 보조 과제와 여러 호흡 주기에 걸친 맥락으로 환자 고유 특성에 대한 과적합을 다시 다뤘습니다.'
