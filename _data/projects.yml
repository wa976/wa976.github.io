  blog:
  - h: TL;DR
    h_ko: 한 줄 요약
    text: 'DCASE 2026 Task 3 asks for a semantic acoustic image every 0.1 s: where on the sphere each sound is,
      and what it is. I led team Jeong_Medisensing on the audio-only Track A and split the problem in two:


      - **Localization:** PanoFormer, an equirectangular transformer with azimuth-circular padding, regresses a
      clean energy field on the sphere.

      - **Classification:** each instance takes the class of the nearest direction of arrival (DOA) from a fine-tuned
      PSELDNets, so all 13 classes can be labelled.


      Development MACRO mask mAP is **0.0515**, against **0.0003** for the official baseline. On the official evaluation
      set the team placed **2nd of 5** in Track A.'
    text_ko: 'DCASE 2026 Task 3는 0.1 s마다 의미 기반 음향 이미지를 요구합니다. 각 소리가 구면 위 어디에 있고 무엇인지를 함께 내야 합니다. 저는 오디오 전용 Track
      A에서 Jeong_Medisensing 팀을 이끌었고, 문제를 둘로 나눴습니다.


      - **위치 추정:** 방위각 순환 패딩을 쓰는 등장방형(equirectangular) 트랜스포머 PanoFormer가 구면 위의 깨끗한 에너지 필드를 회귀합니다.

      - **분류:** 인스턴스마다 미세 조정한 PSELDNets가 낸 가장 가까운 도래 방향(direction of arrival, DOA)의 클래스를 붙입니다. 그래서 13개 클래스 모두에 라벨을
      붙일 수 있습니다.


      개발 세트 MACRO mask mAP는 **0.0515**이고, 공식 베이스라인은 **0.0003**입니다. 공식 평가 세트에서는 Track A **5개 팀 중 2위**를 했습니다.'
  - h: The task
    h_ko: 과제
    text: 'The input is a four-channel first-order (FOA) recording. The output, per 0.1 s frame, is a set of instances,
      each a soft energy footprint on the 360° × 180° equirectangular sphere plus one of 13 sound classes. The data
      are real scene recordings from the STARSS line plus synthetic scenes generated with AudibleLight.


      The metric is mask mAP with a MACRO average over classes. Two of its properties shaped the design:


      - **Every spurious connected component is a false positive,** so the field has to be clean.

      - **A class with no predictions scores zero** instead of being skipped, so all 13 classes need coverage.


      The team ranking combines the ranks of mask mAP and Pearson r. Two practical constraints: the equirectangular
      image wraps around in azimuth (its left and right borders are neighbours), and each output file is capped
      at 20 MB.'
    text_ko: '입력은 4채널 1차(first-order, FOA) 녹음입니다. 출력은 0.1 s 프레임마다 인스턴스 집합이며, 각 인스턴스는 360° × 180° 등장방형 구면 위의 부드러운
      에너지 분포(footprint)와 13개 소리 클래스 중 하나로 이루어집니다. 데이터는 STARSS 계열의 실제 장면 녹음과 AudibleLight로 만든 합성 장면입니다.


      지표는 클래스에 대해 MACRO 평균한 mask mAP입니다. 이 지표의 두 가지 성질이 설계를 좌우했습니다.


      - **잘못 생긴 연결 성분은 모두 거짓 양성입니다.** 그래서 필드가 깨끗해야 합니다.

      - **예측이 없는 클래스는 건너뛰지 않고 0점입니다.** 그래서 13개 클래스를 모두 다뤄야 합니다.


      팀 순위는 mask mAP 순위와 Pearson r 순위를 합쳐 정합니다. 실무적인 제약은 두 가지입니다. 등장방형 이미지는 방위각 방향으로 한 바퀴 돌아 이어지고(왼쪽과 오른쪽 경계가 이웃),
      출력 파일은 파일당 20 MB로 제한됩니다.'
  - h: Key idea
    h_ko: 핵심 아이디어
    text: 'Treat "where" and "what" separately, each shaped by the metric.


      - **Where:** predict one dense field with a model that knows the sphere wraps around, and take its connected
      components as instances.

      - **What:** label instances from per-class directions of arrival, so every class has a place to land.'
    text_ko: '"어디"와 "무엇"을 따로 다루고, 각각을 지표에 맞춰 설계했습니다.


      - **어디:** 구면이 한 바퀴 돌아 이어진다는 것을 아는 모델로 조밀한 필드 하나를 예측하고, 그 연결 성분을 인스턴스로 씁니다.

      - **무엇:** 클래스별 도래 방향으로 인스턴스에 라벨을 붙여, 모든 클래스가 자리를 얻게 합니다.'
  - h: How it works
    h_ko: 방법
    text: '**Front-end (fixed).** A distilled acoustic-imaging front-end (UpLAM, built on latent acoustic mapping)
      maps the recording to a nine-band 9 × 180 × 360 energy image. Its dynamic range is very large, so per-channel
      instance normalization precedes the backbone to keep training stable.


      **PanoFormer field.** The baseline''s planar ResNet/FPN decoder treats the azimuth border as an edge and emits
      wrap artefacts that become false-positive components. I replaced it with PanoFormer, whose attention and patch
      handling include azimuth-circular padding. It regresses a single-channel 512 × 1024 field, down-sampled to
      the 180 × 360 scoring grid. The target is a spherical Gaussian at each annotated source, with extra loss weight
      on source pixels to balance foreground and background.


      **Instances.** Threshold the field at 0.5, take connected components, and export up to 60 points each. Detection
      scores start from peak energy, which ranked better than sum, mean or area-weighted pooling. Threshold 0.5
      with 60 points was the best development setting under the 20 MB limit.


      **Class coverage.** A 13-class linear probe on frozen SSAST embeddings concentrated on a few frequent classes
      on real recordings, and fine-tuning SSAST (full or low-rank) raised training accuracy but lowered test mask
      mAP. The primary branch instead uses PSELDNets (HTSAT-ACCDOA, pre-trained on large-scale synthetic spatial
      audio), which I fine-tuned with a 13-class ACCDOA head. Each instance takes the class of the nearest active
      per-class DOA within a per-class radius. Four-channel DOA is coarse, so wider radii recover more true detections:
      80 pixels for the coverage classes and 40 for the frequent ones worked best.


      **Temporal persistence.** Each detection''s score is its peak energy times the number of nearby frames with
      a same-class detection within 20°, which pushes short-lived false positives down the ranking.


      The four submitted systems share everything except the class branch.'
    text_ko: '**프런트엔드(고정).** 증류된 음향 이미징 프런트엔드(latent acoustic mapping 기반 UpLAM)가 녹음을 9대역 9 × 180 × 360 에너지 이미지로
      바꿉니다. 동적 범위가 매우 넓어서, 학습을 안정시키려고 백본 앞에 채널별 instance normalization을 둡니다.


      **PanoFormer 필드.** 베이스라인의 평면 ResNet/FPN 디코더는 방위각 경계를 끊어진 가장자리로 다루고, 이때 생기는 이음새 아티팩트가 거짓 양성 성분이 됩니다. 저는 이 디코더를
      어텐션과 패치 처리에 방위각 순환 패딩이 들어 있는 PanoFormer로 바꿨습니다. 512 × 1024 단일 채널 필드를 회귀한 뒤 180 × 360 채점 격자로 다운샘플링합니다. 목표 필드는
      주석된 음원마다 구면 가우시안을 놓고, 전경과 배경의 균형을 맞추려고 음원 픽셀에 손실 가중치를 더 줍니다.


      **인스턴스.** 필드를 0.5로 임계 처리해 연결 성분을 구하고, 성분마다 점을 최대 60개까지 내보냅니다. 탐지 점수는 최대 에너지에서 시작하며, 합·평균·면적 가중 풀링보다 순위가 좋았습니다.
      20 MB 제한 안에서는 임계값 0.5와 점 60개가 개발 세트에서 가장 좋았습니다.


      **클래스 커버리지.** 고정한 SSAST 임베딩 위의 13-클래스 선형 프로브는 실제 녹음에서 자주 나오는 몇몇 클래스에 몰렸고, SSAST를 미세 조정하면(전체 또는 low-rank) 학습
      정확도는 올랐지만 테스트 mask mAP는 떨어졌습니다. 그래서 주 분기에는 PSELDNets(대규모 합성 공간 오디오로 사전 학습한 HTSAT-ACCDOA)를 쓰고, 13-클래스 ACCDOA
      헤드로 미세 조정했습니다. 각 인스턴스는 클래스별 반경 안에서 가장 가까운 활성 클래스별 DOA의 클래스를 받습니다. 4채널 DOA는 거칠어서 반경을 넓히면 실제 탐지를 더 많이 살립니다.
      커버리지 클래스 80픽셀, 자주 나오는 클래스 40픽셀이 가장 좋았습니다.


      **시간 지속성.** 탐지마다 최대 에너지에, 20° 안에 같은 클래스 탐지가 있는 주변 프레임 수를 곱해 점수를 매깁니다. 잠깐 나타났다 사라지는 거짓 양성이 순위에서 내려갑니다.


      제출한 시스템 4개는 클래스 분기만 다르고 나머지는 모두 같습니다.'
  - h: Results
    h_ko: 결과
    text: 'Development numbers are in the submittable setting, where every connected component is kept.


      - **The field is the main gain.** Swapping the ResNet/FPN field for the PanoFormer field alone raises mask
      mAP from about 0.017 to 0.0394 at a fixed operating point.

      - **Coverage is what MACRO rewards.** The SSAST probe (system 1) is best when only predicted classes are averaged
      (0.0710) but falls to 0.0156 under the official strict average.

      - **Primary system (system 2):** 0.0515, 172 times the baseline.


      Official evaluation, Track A: **2nd of 5 teams**. The best-ranked system was system 4 (40-pixel radius), with
      mask mAP 0.0662 and Pearson r 0.2765. The primary system scored a slightly higher mAP (0.0668) but a lower
      Pearson r (0.2451). The results page notes that baseline results are not yet included and that a macro-averaging
      bug in mAP was fixed, so these numbers may still change.'
    text_ko: '개발 세트 숫자는 모든 연결 성분을 남기는 제출 가능한 설정 기준입니다.


      - **가장 큰 이득은 필드에서 나왔습니다.** ResNet/FPN 필드를 PanoFormer 필드로 바꾸는 것만으로, 고정된 동작점에서 mask mAP가 약 0.017에서 0.0394로 올랐습니다.

      - **MACRO 평균이 보상하는 것은 커버리지입니다.** SSAST 프로브(시스템 1)는 예측한 클래스만 평균하면 0.0710으로 가장 좋지만, 공식 strict 평균에서는 0.0156으로
      떨어집니다.

      - **주 시스템(시스템 2):** 0.0515로 베이스라인의 172배입니다.


      공식 평가 Track A에서는 **5개 팀 중 2위**를 했습니다. 가장 순위가 높은 시스템은 시스템 4(반경 40픽셀)로 mask mAP 0.0662, Pearson r 0.2765였습니다.
      주 시스템은 mAP가 조금 더 높았지만(0.0668) Pearson r이 낮았습니다(0.2451). 결과 페이지에는 베이스라인 결과가 아직 포함되지 않았고 mAP의 macro 평균 버그를 고쳤다는
      안내가 있어, 이 숫자는 바뀔 수 있습니다.'
    table: 1
  - h: What I did
    h_ko: 내가 한 일
    text: 'I was first author and team lead; the co-author is my advisor, Seong-Eun Kim.


      - Framed the system around the metric: clean fields and full class coverage

      - Replaced the planar decoder with PanoFormer and set up its target, loss weighting and normalization

      - Designed instance extraction and its operating point under the 20 MB limit

      - Fine-tuned PSELDNets, built the per-location class assignment, and tested SSAST and CLAP alternatives

      - Designed the temporal-persistence re-ranking, chose the four submissions and wrote the technical report'
    text_ko: '저는 제1저자이자 팀 리드였고, 공저자는 지도교수인 김성은 교수입니다.


      - 깨끗한 필드와 전체 클래스 커버리지라는 지표의 요구에 맞춰 시스템을 설계했습니다

      - 평면 디코더를 PanoFormer로 바꾸고 목표·손실 가중·정규화를 설정했습니다

      - 인스턴스 추출과 20 MB 제한 안의 동작점을 설계했습니다

      - PSELDNets를 미세 조정해 위치별 클래스 할당을 만들고, SSAST와 CLAP 대안도 시험했습니다

      - 시간 지속성 재순위화를 설계하고, 제출 시스템 4개를 골랐으며, 기술 보고서를 썼습니다'
  - h: Takeaways and limits
    h_ko: 배운 점과 한계
    text: '- **Respect the geometry.** The equirectangular field with circular padding was the main gain, because
      seam artefacts become false positives under this metric.

      - **The averaging rule picks the winner.** The SSAST probe was the strongest system under a predicted-classes-only
      average and the weakest under MACRO.

      - **Localization is the main remaining limit.** Giving every instance its true class on the same field would
      reach 0.0799 on the development set, which bounds what a better class branch can add.

      - **Pearson r counts too.** On evaluation my primary system had the highest mask mAP of the four, but the
      40-pixel system ranked higher overall.'
    text_ko: '- **기하 구조를 존중해야 합니다.** 순환 패딩을 쓰는 등장방형 필드가 가장 큰 이득이었습니다. 이 지표에서는 이음새 아티팩트가 그대로 거짓 양성이 되기 때문입니다.

      - **평균 방식이 최고 시스템을 정합니다.** SSAST 프로브는 예측한 클래스만 평균하면 가장 강했고, MACRO 평균에서는 가장 약했습니다.

      - **남은 가장 큰 한계는 위치 추정입니다.** 같은 필드에서 모든 인스턴스에 정답 클래스를 붙여도 개발 세트에서 0.0799입니다. 분류 분기를 개선해서 얻을 수 있는 몫은 여기까지입니다.

      - **순위에는 Pearson r도 들어갑니다.** 평가 세트에서 제 시스템 4개 중 mask mAP가 가장 높은 것은 주 시스템이었지만, 종합 순위는 반경 40픽셀 시스템이 더 높았습니다.'
- slug: tex-corps-2026
  type:
  - startup
  title: TeX-Corps 2026 — lab startup exploration and I-Corps training in Washington, D.C.
  title_ko: TeX-Corps 2026 — 실험실 창업탐색과 워싱턴 D.C. I-Corps 교육
  short: TeX-Corps 2026
  short_ko: TeX-Corps 2026
  venue: TeX-Corps · 2026
  venue_ko: TeX-Corps · 2026
  venue_long: TeX-Corps 2026 (Tech eXplore-Corps)
  venue_long_ko: 2026 실험실창업탐색교육 TeX-Corps
  role: Participant
  role_ko: 참여
  thumb_text: I-Corps training in Washington, D.C.
  thumb_text_ko: 워싱턴 D.C. I-Corps 교육
  tagline: Korea's I-Corps-style program for lab startups. I tested a sound-AI idea against what customers actually
    said, changed direction because of it, and trained for two weeks in I-Corps at George Washington University.
  tagline_ko: I-Corps 방식의 실험실 창업탐색 프로그램입니다. 소리 AI 아이디어를 고객이 실제로 한 말로 검증했고, 그 결과로 방향을 바꿨으며, 조지워싱턴대에서 2주간 I-Corps
    교육을 받았습니다.
  facts:
  - k: Program
    k_ko: 사업
    v: 2026 Public Technology-based Market-linked Startup Exploration Support Program (TeX-Corps)
    v_ko: 2026 공공기술기반 시장연계 창업탐색 지원사업 (실험실창업탐색교육 TeX-Corps)
  - k: Period
    k_ko: 기간
    v: Apr.–Dec. 2026
    v_ko: 2026년 4월~12월
  - k: Overseas training
    k_ko: 해외 교육
    v: GW I-Corps, Washington, D.C., Jul. 2026
    v_ko: 조지워싱턴대 I-Corps, 워싱턴 D.C., 2026년 7월
  figures: []
  blog:
  - h: TL;DR
    h_ko: 요약
    text: '- **Program:** TeX-Corps (Tech eXplore-Corps), Korea''s 2026 Public Technology-based Market-linked Startup
      Exploration Support Program, April–December 2026.

      - **Method:** I-Corps customer discovery. Write the business down as hypotheses, test them with customers,
      then decide.

      - **Overseas:** two weeks of I-Corps training at George Washington University in Washington, D.C., in July
      2026.

      - **Result:** my starting hypothesis did not hold up, and the idea moved to where the interviews pointed.'
    text_ko: '- **프로그램:** 2026 공공기술기반 시장연계 창업탐색 지원사업, 실험실창업탐색교육 TeX-Corps(Tech eXplore-Corps). 2026년 4월~12월.

      - **방법:** I-Corps 고객 탐색. 사업을 가설로 적고, 고객에게 확인한 뒤, 결정합니다.

      - **해외 교육:** 2026년 7월 워싱턴 D.C. 조지워싱턴대에서 2주간 I-Corps 교육.

      - **결과:** 처음 세운 가설은 버티지 못했고, 아이디어는 인터뷰가 가리킨 쪽으로 옮겨 갔습니다.'
  - h: The program
    h_ko: 프로그램
    text: 'TeX-Corps adapts the U.S. I-Corps model for lab researchers. It reverses the usual order: the business
      model before the business plan, customer development before product development, and a cheap test of demand
      before a working prototype. Instructors guide teams with questions rather than answers, and the program treats
      the outcome as a go/no-go decision on starting a company.'
    text_ko: TeX-Corps는 미국 I-Corps 모델을 실험실 연구자에 맞춘 프로그램입니다. 흔한 순서를 뒤집습니다. 사업계획서보다 비즈니스 모델을, 제품 개발보다 고객 개발을, 작동하는
      시제품보다 수요를 싸게 확인하는 시험을 먼저 합니다. 인스트럭터는 답을 주기보다 질문으로 팀을 이끌고, 프로그램의 결론은 창업할지 말지(Go/No-Go)를 정하는 것입니다.
  - h: How I worked
    h_ko: 어떻게 했나
    text: '- **Hypotheses with evidence labels.** Every claim about customers was written down and tagged as validated
      in interviews, a hypothesis, or literature not yet checked.

      - **Segment definition.** Narrowing "parents" to the two or three filters that actually change behavior, such
      as the child''s age and how much the parent can watch over the child at night.

      - **Buying ecosystem.** Mapping who uses, influences, recommends, decides, pays and blocks.

      - **Customer job and process map.** Writing the parent''s job step by step with the pain at each step, so
      the value proposition attaches to something parents already do every day.

      - **Interviews in Korea and the U.S.** Testing the hypotheses with parents and caregivers.'
    text_ko: '- **근거 표시를 붙인 가설.** 고객에 대한 주장은 모두 적어 두고, 인터뷰로 확인한 것·가설·아직 확인하지 않은 문헌으로 나눠 표시했습니다.

      - **고객 세그먼트 정의.** "부모"를 실제로 행동을 가르는 두세 가지 조건으로 좁혔습니다. 아이의 월령, 밤에 부모가 아이를 얼마나 지켜볼 수 있는지 같은 것입니다.

      - **구매 생태계.** 누가 쓰고, 누가 영향을 주고, 누가 추천하고, 누가 결정하고, 누가 돈을 내고, 누가 막는지 나눠 그렸습니다.

      - **고객의 일과 과정 지도.** 부모가 하는 일을 단계별로 적고 단계마다 어려움을 붙여, 가치 제안이 부모가 이미 매일 하는 일에 붙도록 했습니다.

      - **국내·미국 인터뷰.** 부모와 양육자를 만나 가설을 확인했습니다.'
  - h: What I learned
    h_ko: 배운 것
    text: '- **The first hypothesis did not survive.** My starting hypothesis rested on a worry that parents did
      not bring up themselves in interviews. What kept coming up instead was the effort of writing records by hand,
      keeping records to compare over time, asking other people what to do, and fatigue from too many alerts. So
      the direction moved toward making records easier to keep by voice and easier to ask about.

      - **Usefulness is not willingness to pay.** The buying-ecosystem exercise made me name the payer separately.
      Someone can find a product valuable and recommend it without ever paying for it.

      - **Count only what customers bring up themselves.** A reaction to my pitch is not a need the customer raised
      on their own.

      - **Keep the evidence labels.** Separating validated findings from hypotheses and unchecked literature made
      it obvious which claims I could actually use.'
    text_ko: '- **첫 가설은 버티지 못했습니다.** 처음 가설은 부모가 인터뷰에서 스스로 꺼내지 않는 걱정에 기대고 있었습니다. 대신 손으로 기록하는 부담, 비교하려고 남기는 기록, 주변에
      묻는 습관, 너무 잦은 알림에 대한 피로가 되풀이됐습니다. 그래서 방향을 말로 쉽게 기록하고, 기록에 대해 쉽게 묻는 쪽으로 옮겼습니다.

      - **쓸모가 있다고 돈을 내는 것은 아닙니다.** 구매 생태계를 그리면서 돈을 내는 사람을 따로 적어야 했습니다. 제품을 가치 있게 보고 추천하면서도 돈은 내지 않는 사람이 있습니다.

      - **고객이 먼저 꺼낸 말만 셉니다.** 제 피치에 대한 반응은 고객이 스스로 꺼낸 필요가 아닙니다.

      - **근거 표시를 지킵니다.** 확인한 것, 가설, 확인하지 않은 문헌을 나눠 두니 실제로 쓸 수 있는 주장이 무엇인지 분명해졌습니다.'
  - h: Washington, D.C. training
    h_ko: 워싱턴 D.C. 교육
    text: 'In July 2026 I spent two weeks in George Washington University''s I-Corps training in Washington, D.C.
      Before leaving, our team filled in GW''s pre-departure worksheets: segment definition, segment buying ecosystem,
      and customer job and process map. In D.C., between training sessions, we talked with parents and caregivers
      to test the hypotheses outside Korea.'
    text_ko: 2026년 7월 워싱턴 D.C. 조지워싱턴대에서 2주간 I-Corps 교육을 받았습니다. 출국 전에 팀이 조지워싱턴대의 사전 워크시트(고객 세그먼트 정의, 세그먼트 구매 생태계,
      고객의 일과 과정 지도)를 채워 갔습니다. 현지에서는 교육 사이사이에 부모와 양육자를 만나 한국 밖에서도 가설이 맞는지 확인했습니다.
