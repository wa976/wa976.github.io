- slug: pc-mcl-icassp2026
  title: 'PC-MCL: Patient-Consistent Multi-Cycle Learning with Multi-Label Bias Correction for Respiratory
    Sound Classification'
  short: PC-MCL
  venue: ICASSP 2026
  year: 2026
  authors: '**Seunggyu Jeong**, Seong-Eun Kim'
  role: First author
  tagline: Multi-cycle concatenation with a 3-label scheme and a patient-matching auxiliary task, reaching
    an ICBHI Score of 65.37% on the 4-class benchmark.
  problem: Many respiratory sound classifiers look at one breathing cycle at a time, which ignores the
    temporal context across cycles even though abnormal sounds are often transient and intermittent, and
    they tend to overfit to patient-specific acoustics. Concatenating normal and abnormal cycles is a
    natural fix, but under the conventional 2-label [crackle, wheeze] scheme a normal cycle is [0, 0],
    so a normal+crackle mix is labeled exactly like pure crackle. This "multi-label distributional bias"
    systematically erases the normal information in mixed samples.
  approach: PC-MCL builds each training input by concatenating two respiratory cycles (each padded or
    cropped to half of a 10-second input), using same-class and cross-class pairs from the same and different
    patients. Labels use a 3-label [normal, crackle, wheeze] vector combined by an element-wise OR, so
    a normal+crackle mix becomes [1, 1, 0], trained with multi-label binary cross-entropy. A second head
    on the shared backbone predicts whether the two cycles come from the same patient, with hard negatives
    drawn from different patients with the same pathology; this auxiliary loss is added with weight 0.1.
    At test time, single cycles are padded to the input length, outputs are thresholded at 0.5 and mapped
    to the four ICBHI classes by a fixed priority rule.
  result: On the ICBHI 2017 benchmark (official 60:40 split, 4-class, mean of five seeds), BEATs + PC-MCL
    reaches an ICBHI Score of 65.37% (Sp 79.04%, Se 51.71%), the highest among the methods compared in
    the paper's Table 1. Against cross-entropy baselines it raises the Score from 62.82% to 65.37% (BEATs)
    and from 59.55% to 62.30% (AST), with Sensitivity gains of 2.92 and 4.08 points. Replacing the 2-label
    with the 3-label formulation lifts the Score from 60.42% to 65.37%, and average precision for crackle
    and wheeze rises from 0.209 and 0.116 (CE baseline) to 0.642 and 0.663.
  venue_long: IEEE ICASSP 2026
  type:
  - research
  tagline_ko: 호흡 주기 여러 개를 이어 붙이는 학습에 3-라벨 방식과 환자 일치 보조 과제를 결합해, 4-클래스 벤치마크에서 ICBHI Score 65.37%에 도달했습니다.
  role_ko: 제1저자
  problem_ko: 많은 호흡음 분류기는 호흡 주기를 한 번에 하나씩만 봅니다. 이상음은 잠깐 나타나거나 간헐적인 경우가 많은데도 주기 사이의 시간적 맥락을 무시하고, 환자 고유의
    음향 특성에 과적합하기 쉽습니다. 정상 주기와 이상 주기를 이어 붙이는 것이 자연스러운 해법이지만, 기존의 2-라벨 [crackle, wheeze](수포음, 천명음) 방식에서는
    정상 주기가 [0, 0]이므로 정상+crackle 조합이 순수 crackle과 똑같이 라벨링됩니다. 이 "다중 라벨 분포 편향(multi-label distributional
    bias)"은 섞인 샘플에서 정상 정보를 체계적으로 지웁니다.
  approach_ko: PC-MCL은 호흡 주기 두 개를 이어 붙여 학습 입력 하나를 만듭니다(각 주기는 10초 입력의 절반 길이로 패딩하거나 자릅니다). 같은 환자와 다른 환자에서
    나온 같은 클래스 쌍과 다른 클래스 쌍을 모두 씁니다. 라벨은 3-라벨 [normal, crackle, wheeze] 벡터를 원소별 OR로 합치므로 정상+crackle 조합은
    [1, 1, 0]이 되고, 다중 라벨 이진 교차 엔트로피로 학습합니다. 공유 백본 위의 두 번째 헤드는 두 주기가 같은 환자에게서 나왔는지를 예측합니다. 어려운 음성 샘플(hard
    negative)은 같은 병리를 가진 다른 환자에게서 뽑고, 이 보조 손실은 가중치 0.1로 더합니다. 테스트 때는 단일 주기를 입력 길이에 맞게 패딩하고, 출력을 0.5로 임계
    처리한 뒤 고정된 우선순위 규칙으로 ICBHI의 4개 클래스에 대응시킵니다.
  result_ko: ICBHI 2017 벤치마크(공식 60:40 분할, 4-클래스, 시드 5개 평균)에서 BEATs + PC-MCL은 ICBHI Score 65.37%(Sp 79.04%,
    Se 51.71%)를 기록해, 논문 Table 1에서 비교한 방법 중 가장 높았습니다. 교차 엔트로피 베이스라인 대비 Score를 62.82%에서 65.37%로(BEATs),
    59.55%에서 62.30%로(AST) 올렸고, 민감도는 각각 2.92, 4.08 포인트 높아졌습니다. 2-라벨 대신 3-라벨 방식을 쓰면 Score가 60.42%에서 65.37%로
