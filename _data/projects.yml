  thumb: /assets/img/projects/imedic-chi2025/1-teaser_final.webp
  blog:
  - h: TL;DR
    h_ko: 한 줄 요약
    text: 'iMedic is a smartphone self-auscultation system for children: the app guides a parent through recording
      lung sounds at four sites, and an Audio Spectrogram Transformer (AST) on a server flags abnormal sounds. With
      few phone recordings available, I combined a 13,023-clip stethoscope dataset with a 1,298-clip smartphone
      dataset, using a MixStyle variant that mixes device style only within a class. It reached **F1 0.82** on smartphone
      recordings, and 12 parents rated the app **78** on the System Usability Scale (SUS).'
    text_ko: iMedic은 아이를 위한 스마트폰 자가 청진 시스템입니다. 앱이 부모에게 네 부위의 폐음을 녹음하는 과정을 안내하고, 서버의 Audio Spectrogram Transformer(AST)가
      이상음을 알려 줍니다. 스마트폰 녹음이 적어서 청진기 데이터셋(13,023 클립)과 스마트폰 데이터셋(1,298 클립)을 함께 썼고, 같은 클래스 안에서만 기기 스타일을 섞는 MixStyle
      변형을 썼습니다. 스마트폰 녹음에서 **F1 0.82**를 기록했고, 부모 12명이 매긴 System Usability Scale(SUS) 점수는 **78**이었습니다.
  - h: The problem
    h_ko: 문제
    text: 'Auscultation is central to catching pediatric pneumonia early, and it needs a trained ear, which is scarce
      where doctors are hard to reach. Electronic stethoscopes enabled AI classification but are expensive and rare
      in resource-limited settings. Earlier smartphone studies mostly showed that clinicians can hear abnormal sounds
      in phone recordings, without automatic classification.


      Two problems had to be solved together:


      - **The model.** Labelled phone data is small (1,298 clips vs 13,023), and the devices sound different: a
      stethoscope-only model fell from a Score (mean of sensitivity and specificity) of 87.33% on stethoscope tests
      to 77.79% on phone recordings.

      - **The people.** Parents have no auscultation training, yet they must find the spot, place the phone and
      record a usable clip on their own.'
    text_ko: '청진은 소아 폐렴을 조기에 잡아내는 핵심 수단이지만 숙련된 귀가 필요하고, 의사를 만나기 어려운 곳에서는 그 귀가 부족합니다. 전자 청진기 덕분에 AI 분류가 가능해졌지만, 전자
      청진기는 비싸고 자원이 부족한 환경에서는 드뭅니다. 기존 스마트폰 연구는 대부분 임상의가 휴대폰 녹음에서 이상음을 들을 수 있다는 것을 보이는 데서 그쳤고, 자동 분류는 다루지 않았습니다.


      두 문제를 함께 풀어야 했습니다.


      - **모델.** 라벨이 달린 스마트폰 데이터가 적고(1,298 클립 대 13,023 클립), 두 기기의 소리가 다릅니다. 청진기 데이터만으로 학습한 모델의 Score(민감도와 특이도의 평균)는
      청진기 테스트에서 87.33%였지만 스마트폰 녹음에서는 77.79%로 떨어졌습니다.

      - **사람.** 부모는 청진을 배운 적이 없는데도 혼자서 위치를 찾고, 휴대폰을 대고, 쓸 만한 녹음을 남겨야 합니다.'
  - h: Key idea
    h_ko: 핵심 아이디어
    text: 'Borrow the stethoscope data''s volume and labels while keeping the model from keying on the device. I
      changed MixStyle in two ways:


      - feature statistics are mixed along the **frequency axis**;

      - mixing happens only between a stethoscope sample and a smartphone sample with the **same class label**,
      so the device style varies while the class evidence stays.


      For the app, the goal was a recording step that is hard to get wrong, because the model only hears what the
      parent records.'
    text_ko: '청진기 데이터의 양과 라벨은 빌려 오면서, 모델이 기기 특성에 기대지 않게 만듭니다. 이를 위해 MixStyle을 두 가지로 바꿨습니다.


      - 특징 통계를 **주파수 축**을 따라 섞습니다.

      - 섞기는 **같은 클래스 라벨을 가진** 청진기 샘플과 스마트폰 샘플 사이에서만 합니다. 기기 스타일은 바뀌어도 클래스 정보는 그대로 남습니다.


      앱의 목표는 녹음 단계에서 실수하기 어렵게 만드는 것이었습니다. 모델은 부모가 녹음한 소리만 듣기 때문입니다.'
  - h: 'How it works: the model'
    h_ko: '방법: 모델'
    text: '**Data.** Collected with Woori Children''s Hospital in Seoul from children aged 0–6, October 2021 – December
      2023 (IRB 2021-0017-02):


      - Stethoscope: 3M Littmann CORE at four sites (upper and lower lobes on both sides), 4,000 Hz; 707 children,
      13,023 clips.

      - Smartphone: iPhone 13 at the same sites right after the stethoscope, 48,000 Hz; 195 children, 1,298 clips.


      Two clinicians removed noisy or unclear recordings and labelled the ~3-second clips as normal, crackle, wheeze
      or both; the three abnormal labels were merged for binary screening.


      **Pipeline.** Phone audio is resampled and low-pass filtered to match the stethoscope''s frequency range.
      Spectrograms get SpecAugment and are split into patches for an AST with two MixStyle blocks: one after patch
      embedding and one between the two six-layer halves of the encoder. A classifier outputs normal or abnormal.'
    text_ko: '**데이터.** 서울 우리아이들병원과 함께 2021년 10월부터 2023년 12월까지 0–6세 아이들의 폐음을 모았습니다(IRB 2021-0017-02).


      - 청진기: 3M Littmann CORE, 네 부위(좌우 상엽·하엽), 4,000 Hz. 아이 707명, 13,023 클립.

      - 스마트폰: iPhone 13, 청진기 녹음 직후 같은 네 부위, 48,000 Hz. 아이 195명, 1,298 클립.


      임상의 2명이 잡음이 심하거나 폐음이 불분명한 녹음을 빼고, 약 3초 클립에 정상·수포음·천명음·둘 다 중 하나로 라벨을 달았습니다. 이진 선별을 위해 이상 라벨 세 가지를 하나로 합쳤습니다.


      **파이프라인.** 스마트폰 오디오는 리샘플링과 저역 통과 필터로 청진기의 주파수 범위에 맞춥니다. 스펙트로그램에 SpecAugment를 적용하고 패치로 나눠 AST에 넣습니다. AST에는
      MixStyle 블록이 두 개 있습니다. 하나는 패치 임베딩 바로 뒤, 다른 하나는 인코더 6층과 6층 사이입니다. 마지막 분류기가 정상 또는 이상을 출력합니다.'
    fig: 2
  - h: 'How it works: the app'
    h_ko: '방법: 앱'
    text: 'The "i" in iMedic evokes 아이, the Korean word for "child". The research app has three steps:


      1. **Symptoms.** The parent picks the child''s current symptoms, such as fever or cough.

      2. **Guided recording.** Illustrations show four sites on the chest and back; the app records 10 seconds per
      site, with on-screen cues at each step.

      3. **Result.** The audio goes to the AI server, and the app shows "normal" or recommends seeing a doctor.


      Recordings are stored, so the lung-sound database keeps growing for future training.'
    text_ko: 'iMedic의 "i"는 우리말 "아이"에서 따왔습니다. 연구용 앱은 세 단계입니다.


      1. **증상 입력.** 부모가 열이나 기침 같은 아이의 현재 증상을 고릅니다.

      2. **녹음 안내.** 그림으로 가슴과 등의 네 부위를 보여 주고, 부위마다 10초씩 녹음합니다. 단계마다 화면에 안내가 나옵니다.

      3. **결과.** 녹음이 AI 서버로 가고, 앱은 "정상"을 보여 주거나 진료를 권합니다.


      녹음은 저장되기 때문에 폐음 데이터베이스가 계속 늘어나고, 이후 학습에 쓸 수 있습니다.'
    fig: 3
  - h: Experiments and results
    h_ko: 실험과 결과
    text: '**Classification.** Five-fold cross-validation stratified by the normal/abnormal ratio. Each fold trained
      on about 1,040 smartphone clips (plus about 10,400 stethoscope clips in the combined setups) and tested on
      about 260 smartphone clips.


      - Adding stethoscope data: Score 80.40% → 85.40%, F1 0.74 → 0.80.

      - Class-conditional MixStyle: Score 86.90%, F1 0.82, with sensitivity up from 79.20% to 83.30%.

      - Combining the data also steadied specificity across folds: ± 13.74 points with phone-only training, ± 2.70
      and ± 4.69 for the two combined models.

      - The stethoscope-only model kept a high sensitivity on phone audio (86.30%), but its specificity fell to
      69.29%.


      **Usability.** Twelve parents in their mid-30s, new to recording lung sounds, ran the full flow with their
      children (aged 0–6) and answered the 10-item SUS: mean **78**, above the commonly used benchmark of 68. "I
      would like to use this system frequently" and "I thought the system was easy to use" both averaged 4.3 out
      of 5.'
    text_ko: '**분류.** 정상/이상 비율로 층화한 5-fold 교차 검증을 썼습니다. fold마다 스마트폰 클립 약 1,040개(통합 설정에서는 청진기 클립 약 10,400개 추가)로 학습하고
      스마트폰 클립 약 260개로 평가했습니다.


      - 청진기 데이터 추가: Score 80.40% → 85.40%, F1 0.74 → 0.80

      - 클래스 조건부 MixStyle: Score 86.90%, F1 0.82, 민감도 79.20% → 83.30%

      - 데이터를 합치자 fold 간 특이도 편차도 줄었습니다. 스마트폰 단독 학습은 ± 13.74%p, 두 통합 모델은 ± 2.70%p와 ± 4.69%p였습니다.

      - 청진기 데이터만으로 학습한 모델은 스마트폰 녹음에서 민감도는 86.30%로 높았지만 특이도가 69.29%로 떨어졌습니다.


      **사용성.** 폐음을 녹음해 본 적 없는 30대 중반 부모 12명이 0–6세 자녀와 함께 전체 과정을 해 본 뒤 10문항 SUS에 답했습니다. 평균은 **78**로, 흔히 쓰는 기준점 68보다
      높았습니다. "이 시스템을 자주 쓰고 싶다"와 "쓰기 쉬웠다"는 둘 다 5점 만점에 4.3이었습니다.'
    table: 1
  - h: From paper to product (2024)
    h_ko: 논문에서 제품으로 (2024)
    text: 'In 2024, iMedic became MediSensing''s first product: a consumer app built under the Pre-Startup Package
      (예비창업패키지). I planned the app and led its AI.


      The recording flow walks the parent through four steps:


      - **Calm check.** Measure while the child is calm; the screen notes that crying makes an accurate measurement
      hard.

      - **Breathing prompt.** A countdown while the parent helps the child take deep breaths.

      - **Position guide.** An illustration of where to hold the phone: upper left chest first, then upper right
      chest.

      - **Recording.** 10 seconds per site, with a live waveform and timer.'
    text_ko: '2024년에 iMedic은 메디센싱의 첫 제품이 되었습니다. 예비창업패키지로 만든 소비자용 앱이고, 저는 앱 기획과 AI를 맡았습니다.


      녹음 과정은 네 단계로 안내합니다.


      - **진정 상태 확인.** 아이가 진정된 상태에서 측정하도록 하고, 아이가 울면 정확한 측정이 어렵다고 알려 줍니다.

      - **숨쉬기 안내.** 부모가 아이에게 숨을 크게 쉬도록 도와주는 동안 카운트다운이 돌아갑니다.

      - **위치 안내.** 휴대폰을 어디에 대야 하는지 그림으로 보여 줍니다. 왼쪽 가슴 위, 그다음 오른쪽 가슴 위 순서입니다.

      - **녹음.** 부위마다 10초씩 녹음하며 파형과 시간이 실시간으로 나옵니다.'
    fig: 4
  - h: What I did
    h_ko: 내가 한 일
    text: '- Designed the model side: the smartphone preprocessing and the class-conditional, frequency-axis MixStyle.

      - Designed the app flow, from symptom input through guided recording to the result screen.

      - Ran the classification experiments and wrote the paper as first author, covering the model, the app and
      the usability evaluation.

      - At MediSensing, planned the 2024 product app and led its AI.


      My co-authors Sungwoo Nam and Seongkwan Jung are pediatricians at Woori Children''s Hospital, where the data
      was collected, and Prof. Seong-Eun Kim advised the work.'
    text_ko: '- 모델 쪽을 설계했습니다. 스마트폰 전처리, 그리고 주파수 축 통계를 같은 클래스끼리 섞는 MixStyle입니다.

      - 증상 입력부터 녹음 안내, 결과 화면까지 앱 흐름을 설계했습니다.

      - 분류 실험을 돌리고, 제1저자로 모델·앱·사용성 평가를 담은 논문을 썼습니다.

      - 메디센싱에서 2024년 제품 앱을 기획하고 AI를 맡았습니다.


      공저자 Sungwoo Nam, Seongkwan Jung 선생님은 데이터를 모은 우리아이들병원의 소아청소년과 전문의이고, 김성은 교수가 연구를 지도했습니다.'
  - h: Takeaways and limits
    h_ko: 배운 점과 한계
    text: '- **More data helped before any adaptation.** Adding the stethoscope set lifted F1 from 0.74 to 0.80;
      class-conditional mixing added a smaller step to 0.82.

      - **The phone still trails the stethoscope.** With MixStyle, the smartphone Score (86.90%) stayed slightly
      below a model trained and tested on stethoscope data (87.33%).

      - **One hospital, one phone.** Other phone models and recording environments are untested.

      - **Parents wanted clearer cues:** prompts to confirm placement, a vibration when recording starts and a sound
      when it ends.


      The paper''s next steps: more phone models, environments and populations; real-time feedback in the app; better
      use of symptom data; and age- or disease-specific models. The [journal follow-up](/projects/jbhi-2026-smartphone-lung-sound/)
      adds paired-recording analysis and an external cohort from a second site.'
    text_ko: '- **적응 전에도 데이터를 늘린 효과가 있었습니다.** 청진기 데이터를 더하자 F1이 0.74에서 0.80으로 올랐고, 클래스 조건부 섞기가 0.82까지 조금 더 올렸습니다.

      - **스마트폰은 아직 청진기에 못 미칩니다.** MixStyle을 써도 스마트폰 Score(86.90%)는 청진기 데이터로 학습하고 평가한 모델(87.33%)보다 조금 낮았습니다.

      - **병원 하나, 기종 하나.** 다른 휴대폰 기종과 녹음 환경에서는 아직 검증하지 못했습니다.

      - **부모는 더 분명한 신호를 원했습니다.** 위치가 맞는지 확인해 주는 안내, 녹음이 시작될 때 진동, 끝날 때 알림음 같은 것입니다.


      논문에 적은 다음 단계는 더 많은 기종·환경·대상으로 데이터를 넓히고, 앱에 실시간 피드백을 넣고, 증상 정보를 더 잘 활용하고, 연령별·질환별 모델을 만드는 것입니다. [후속 저널 논문](/projects/jbhi-2026-smartphone-lung-sound/)은
      쌍 녹음 분석과 두 번째 기관의 외부 코호트를 더했습니다.'
