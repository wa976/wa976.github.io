  blog:
  - h: TL;DR
    h_ko: 한 줄 요약
    text: Smartphone lung recordings are scarce and sound different from stethoscope recordings. PD-SCL adds a supervised
      contrastive loss to an Audio Spectrogram Transformer (AST); its positive pairs share a label but come from
      different patients or devices. On pediatric recordings from a children's hospital in Seoul, it reaches a normal/abnormal
      score of **86.3%** on smartphone audio (5-fold cross-validation), 2.4 points above AST fine-tuned on the combined
      data.
    text_ko: 스마트폰 폐음 녹음은 양이 적고 청진기 녹음과 소리 특성도 다릅니다. PD-SCL은 Audio Spectrogram Transformer(AST)에 지도 대조 손실을 더하는데,
      이 손실의 양성 쌍은 라벨은 같고 환자나 기기가 다른 쌍입니다. 서울의 한 어린이병원 소아 녹음에서 5-fold 교차 검증을 한 결과, 스마트폰 녹음의 정상/이상 score는 **86.3%**,
      합친 데이터로 미세 조정한 AST보다 2.4포인트 높았습니다.
  - h: The problem
    h_ko: 문제
    text: 'Smartphone microphones could take lung-sound assessment beyond in-person visits, but two gaps get in
      the way:


      - **Device gap.** iPhone recordings differ in audio style from electronic stethoscope recordings.

      - **Patient variability.** Recordings also differ from one patient to the next.


      Phone data are the scarce side: 2,701 recordings from 63 patients, against 8,724 stethoscope recordings from
      342 patients. Pooling alone does not help: AST fine-tuned on the combined data (83.9%) scores slightly below
      AST fine-tuned on phone data only (84.1%).'
    text_ko: '스마트폰 마이크를 쓰면 대면 진료 밖에서도 폐음을 평가할 수 있지만, 두 가지 차이가 걸림돌입니다.


      - **기기 차이.** iPhone 녹음은 전자 청진기 녹음과 오디오 스타일이 다릅니다.

      - **환자 간 차이.** 녹음은 환자마다도 다릅니다.


      부족한 쪽은 스마트폰 데이터입니다. 청진기 녹음은 환자 342명의 8,724건인데 스마트폰 녹음은 환자 63명의 2,701건입니다. 데이터를 합치기만 해서는 도움이 되지 않습니다. 합친 데이터로
      미세 조정한 AST(83.9%)는 스마트폰 데이터만 쓴 AST(84.1%)보다 조금 낮습니다.'
  - h: Key idea
    h_ko: 핵심 아이디어
    text: Make the contrastive loss pull together exactly the pairs that cross the two gaps. A positive pair has
      the same label but a different patient or a different recording device (domain); pairs with different labels
      are negatives. Same-label pairs from the same patient on the same device are not positives, so the loss rewards
      features that agree on the label across patients and devices.
    text_ko: 대조 손실이 두 차이를 가로지르는 쌍만 끌어당기게 합니다. 양성 쌍은 라벨이 같으면서 환자나 녹음 기기(도메인)가 다른 쌍이고, 라벨이 다른 쌍은 음성 쌍입니다. 같은 환자가 같은
      기기로 녹음한 같은 라벨 쌍은 양성이 아니므로, 이 손실은 환자와 기기가 달라도 라벨이 일치하는 특징을 강화합니다.
  - h: How it works
    h_ko: 방법
    text: '- **Backbone.** AST fine-tuned with cross-entropy for normal vs. abnormal (crackle, wheeze or both).

      - **Contrastive term.** L2-normalized features, temperature-scaled dot-product similarities, and positive/negative
      masks built from labels, patient IDs and device IDs; a log-sum-exp step keeps it stable.

      - **Total loss.** Cross-entropy + 0.5 × PD-SCL, temperature 0.5.

      - **Input.** 16 kHz audio in 8-second clips (repeat-padded or truncated), 128-dimensional log Mel filterbank
      features.

      - **Baselines.** AST on phone data only, AST on the combined data, and domain adversarial training (DAT, adversarial
      weight 0.2).'
    text_ko: '- **백본.** 정상 대 이상(crackle, wheeze, 또는 둘 다)을 교차 엔트로피로 미세 조정한 AST입니다.

      - **대조 항.** L2 정규화한 특징, 온도로 스케일한 내적 유사도, 그리고 라벨·환자 ID·기기 ID로 만든 양성/음성 마스크를 씁니다. log-sum-exp로 수치 안정성을 확보합니다.

      - **전체 손실.** 교차 엔트로피 + 0.5 × PD-SCL이며 온도는 0.5입니다.

      - **입력.** 16 kHz 오디오를 8초 길이로 맞추고(반복 패딩 또는 자르기) 128차원 log Mel filterbank 특징으로 바꿉니다.

      - **비교 대상.** 스마트폰 데이터만 쓴 AST, 합친 데이터로 학습한 AST, 도메인 적대적 학습(DAT, 적대 손실 가중치 0.2)입니다.'
  - h: Experiments and results
    h_ko: 실험과 결과
    text: '**Data.** Pediatric lung sounds recorded by medical professionals at Woori Children''s Hospital in Seoul
      with a 3M Littmann digital stethoscope and an iPhone; every phone patient also has stethoscope recordings.


      **Protocol.** 5 folds; training uses both devices, validation uses phone recordings only, and test patients
      are kept out of training (leave-subject-out). Score = mean of Sp and Se, with crackle, wheeze and both counted
      as abnormal.


      - **PD-SCL: Sp 89.9%, Se 82.7%, score 86.3%**, the best of the four.

      - AST phone-only 84.1%, AST combined 83.9%, DAT 83.7%.

      - DAT has the highest Sp (92.5%) at the cost of Se (74.8%); PD-SCL keeps Se at the AST level while raising
      Sp.

      - ROC AUC (cover figure): PD-SCL 0.90, AST phone-only 0.89, AST combined 0.88, DAT 0.86.'
    text_ko: '**데이터.** 서울 우리아이들병원에서 의료진이 3M Littmann 디지털 청진기와 iPhone으로 녹음한 소아 폐음입니다. 스마트폰으로 녹음한 환자는 모두 청진기 녹음도 있습니다.


      **평가 방식.** 5-fold입니다. 학습에는 두 기기를 모두 쓰고 검증에는 스마트폰 녹음만 쓰며, 테스트 환자는 학습에서 제외합니다(leave-subject-out). score는 Sp와
      Se의 평균이고, crackle, wheeze, 둘 다인 경우를 모두 이상으로 셉니다.


      - **PD-SCL: Sp 89.9%, Se 82.7%, score 86.3%**. 네 방법 중 가장 높습니다.

      - 스마트폰 데이터만 쓴 AST 84.1%, 합친 데이터로 학습한 AST 83.9%, DAT 83.7%입니다.

      - DAT는 Sp가 가장 높지만(92.5%) Se가 74.8%로 떨어집니다. PD-SCL은 Se를 AST 수준으로 유지하면서 Sp를 올립니다.

      - ROC AUC(맨 위 그림)는 PD-SCL 0.90, 스마트폰 데이터만 쓴 AST 0.89, 합친 데이터로 학습한 AST 0.88, DAT 0.86입니다.'
    table: 1
  - h: What I did
    h_ko: 내가 한 일
    text: '- Framed smartphone lung-sound classification as a two-gap problem, device and patient, and designed
      PD-SCL''s pair rule around it.

      - Implemented AST fine-tuning, the DAT baseline and PD-SCL.

      - Set up the patient-disjoint 5-fold protocol that validates on phone recordings only.

      - Ran the comparisons and ROC analysis, and wrote the paper (ITC-CSCC 2024, first author).'
    text_ko: '- 스마트폰 폐음 분류를 기기와 환자라는 두 가지 차이의 문제로 정의하고, 여기에 맞춰 PD-SCL의 쌍 규칙을 설계했습니다.

      - AST 미세 조정, DAT 베이스라인, PD-SCL을 구현했습니다.

      - 환자가 겹치지 않고 스마트폰 녹음으로만 검증하는 5-fold 평가 방식을 구성했습니다.

      - 비교 실험과 ROC 분석을 수행하고 논문을 썼습니다(ITC-CSCC 2024, 제1저자).'
  - h: Takeaways and limits
    h_ko: 배운 점과 한계
    text: '- **More data from another device is not automatically better.** Naive pooling and DAT both scored below
      phone-only training; PD-SCL turned the combined data into a gain.

      - **Scope.** 5-fold cross-validation on one pediatric dataset from one hospital, as a binary normal/abnormal
      task.

      - **Next.** I carried the patient side to the public ICBHI benchmark in PAFA (INTERSPEECH 2025), and the device
      side continued in my IEEE JBHI 2026 smartphone paper.'
    text_ko: '- **다른 기기의 데이터가 많다고 저절로 좋아지지는 않습니다.** 단순히 합친 경우와 DAT 모두 스마트폰 데이터만 쓴 학습보다 낮았고, 합친 데이터를 성능 향상으로 바꾼 것은
      PD-SCL이었습니다.

      - **범위.** 한 병원의 소아 데이터셋 하나에서 정상/이상 이진 분류를 5-fold 교차 검증으로 평가했습니다.

      - **다음 연구.** 환자 쪽 문제는 공개 벤치마크 ICBHI로 옮겨 PAFA(INTERSPEECH 2025)에서 다뤘고, 기기 쪽 문제는 IEEE JBHI 2026 스마트폰 논문으로 이어졌습니다.'
