- slug: imedic-chi2025
  title: 'iMedic: Towards Smartphone-based Self-Auscultation Tool for AI-Powered Pediatric Respiratory
    Assessment'
  short: iMedic
  venue: CHI 2025 EA
  year: 2025
  authors: '**Seunggyu Jeong**, Sungwoo Nam, Seongkwan Jung, Seong-Eun Kim'
  role: First author
  topics:
  - lung-sound
  - generalization
  - mobile-health
  tagline: 'Smartphone app that guides parents to record their child''s lung sounds and flags abnormal
    sounds with AI: F1 0.82 on smartphone recordings, SUS 78.'
  problem: Auscultation is central to catching pediatric pneumonia early, but it depends on the listening
    expertise of medical professionals, which limits its use where physicians are hard to reach. Electronic
    stethoscopes have enabled AI-based lung-sound classification, yet they are relatively expensive and
    have low adoption in resource-limited settings. Earlier smartphone studies mainly showed that smartphone
    recordings are feasible and good enough for clinicians to hear abnormal sounds, but most did not include
    AI that classifies abnormal lung sounds automatically.
  approach: 'iMedic is a mobile app that walks caregivers through three steps: entering the child''s symptoms,
    recording lung sounds at four chest and back sites (10 seconds per site) with on-screen placement
    guides, and receiving an AI assessment from a server that reports "normal" or recommends a medical
    consultation. The classifier is an Audio Spectrogram Transformer (AST) trained on a large electronic-stethoscope
    dataset (13,023 clips from 707 children, 3M Littmann CORE) together with a smaller smartphone dataset
    (1,298 clips from 195 children, iPhone 13), recorded at a children''s hospital in Seoul. Smartphone
    audio is resampled and low-pass filtered to match the stethoscope''s frequency range, and a modified
    MixStyle block mixes frequency-axis feature statistics between devices only for samples that share
    the same class label, inserted at two points in the AST encoder. Crackle, wheeze and both are merged
    into a single "abnormal" class for binary screening.'
  result: In five-fold stratified cross-validation tested on smartphone recordings, the combined model
    with MixStyle reached specificity 90.30%, sensitivity 83.30%, Score (mean of sensitivity and specificity)
    86.90% and F1 0.82, compared with Score 80.40% and F1 0.74 for smartphone-only training and Score
    85.40% and F1 0.80 for combining the data without MixStyle. A model trained only on stethoscope data
    scored 87.33% on stethoscope test data but dropped to 77.79% when tested on smartphone recordings.
    In a usability study with 12 parents and their children aged 0–6, the app received an average System
    Usability Scale (SUS) score of 78, above the commonly used benchmark of 68.
  venue_long: CHI 2025 Extended Abstracts
  metrics:
  - value: '0.82'
    label: F1 on smartphone recordings (stethoscope + smartphone data with MixStyle, 5-fold CV)
  - value: 86.90%
