  blog:
  - h: TL;DR
    h_ko: 한 줄 요약
    text: 'The NeckVibe Challenge at INTERSPEECH 2026 asks: given about a week of neck-surface accelerometer recordings
      from one person and a single label for that person, can we detect phonotraumatic (PVH) or non-phonotraumatic
      (NPVH) vocal hyperfunction?


      Our team, led by first author Kiran Yerpude, built a two-branch system: CatBoost on day-level statistics,
      attention-based multiple instance learning (MIL) on 12 s windows, and a logistic-regression stacker on top.


      - **NPVH (Task 2):** test AUC **0.861**, 1st place, tied with team VascoASR

      - **PVH (Task 1):** test AUC **0.891**, 3rd place


      I was the second author, in a supervising role.'
    text_ko: 'INTERSPEECH 2026 NeckVibe 챌린지는 이렇게 묻습니다. 한 사람의 목 표면 가속도계 기록 약 일주일 치와 그 사람에 대한 라벨 하나만으로, 발성 외상성 음성
      과기능(PVH)이나 비발성 외상성 음성 과기능(NPVH)을 탐지할 수 있는가?


      제1저자 Kiran Yerpude가 이끈 우리 팀은 두 분기 시스템을 만들었습니다. 일 단위 통계를 쓰는 CatBoost, 12 s 윈도를 쓰는 어텐션 기반 다중 인스턴스 학습(MIL), 그리고
      그 위의 로지스틱 회귀 스태커입니다.


      - **NPVH (Task 2):** 테스트 AUC **0.861**, VascoASR 팀과 공동 1위

      - **PVH (Task 1):** 테스트 AUC **0.891**, 3위


      저는 제2저자로 지도 역할을 맡았습니다.'
  - h: The task
    h_ko: 과제
    text: 'Vocal hyperfunction is overuse or inefficient use of the laryngeal muscles during voicing. PVH comes
      with vocal-fold lesions such as nodules or polyps; NPVH does not.


      A neck accelerometer does not capture intelligible speech, so it can record daily voice use for days while
      preserving privacy. The dataset covers 582 people: 213 with PVH and 169 matched controls, and 116 with NPVH
      and 84 matched controls. Recordings come as 50 ms frame-level features such as f0, SPL, CPP, H1–H2 and spectral
      tilt, plus glottal measures from impedance-based inverse filtering (IBIF) that are missing for some subjects.
      Two binary tasks, each disorder against everyone else, are scored by subject-level AUC.


      Why it is hard:


      - **Weak labels.** One label covers days of recording, and the informative short segments are not marked.

      - **Noisy data.** Daily voice behavior is variable, and sensor dropouts leave missing values.

      - **Two time scales.** PVH shows up as transient phonatory bursts in short windows; NPVH is a sustained inefficiency
      spread across days.'
    text_ko: '음성 과기능(vocal hyperfunction)은 발성할 때 후두 근육을 과하게 또는 비효율적으로 쓰는 상태입니다. PVH는 결절이나 폴립 같은 성대 병변을 동반하고, NPVH는
      동반하지 않습니다.


      목 가속도계에는 알아들을 수 있는 말소리가 담기지 않으므로, 사생활을 지키면서 일상의 음성 사용을 며칠 동안 기록할 수 있습니다. 데이터는 582명으로, PVH 213명과 짝지은 대조군 169명,
      NPVH 116명과 짝지은 대조군 84명입니다. 기록은 f0, SPL, CPP, H1–H2, 스펙트럼 기울기(spectral tilt) 같은 50 ms 프레임 단위 특징과, 임피던스 기반 역필터링(IBIF)으로
      구한 성문 지표로 주어집니다. IBIF 지표는 일부 대상자에게 없습니다. 과제는 각 장애 대 나머지 전체의 이진 분류 두 개이고, 대상자 단위 AUC로 평가합니다.


      어려운 점:


      - **약한 라벨.** 며칠 치 기록에 라벨이 하나뿐이고, 정보가 담긴 짧은 구간은 표시되어 있지 않습니다.

      - **잡음이 많은 데이터.** 일상의 음성 행동은 변동이 크고, 센서 누락으로 결측값이 생깁니다.

      - **두 가지 시간 척도.** PVH는 짧은 윈도 안의 순간적인 발성 버스트로 드러나고, NPVH는 여러 날에 걸친 지속적인 비효율로 나타납니다.'
  - h: Key idea
    h_ko: 핵심 아이디어
    text: 'Give each branch one time scale.


      - A **tabular model** summarizes long-term day-level distributions, which suits NPVH.

      - A **MIL model** scores short windows and learns which ones matter, which suits PVH.

      - A **stacker** combines both and also sees where they agree or disagree.'
    text_ko: '분기마다 시간 척도 하나를 맡깁니다.


      - **표 형식 모델**은 일 단위 장기 분포를 요약하므로 NPVH에 맞습니다.

      - **MIL 모델**은 짧은 윈도를 보면서 어떤 윈도가 중요한지 배우므로 PVH에 맞습니다.

      - **스태커**는 둘을 합치면서, 두 분기가 어디서 일치하고 어디서 갈리는지도 봅니다.'
  - h: How it works
    h_ko: 방법
    text: '**1. Frame filtering.** Keep only voiced, non-singing frames recorded with the device on, remove per-channel
      amplitude outliers (robust z-score), and encode missing values as zeros plus a binary indicator so a true
      zero differs from a sensor dropout.


      **2. CatBoost branch.** For each acoustic and IBIF channel under several mask conditions, compute day-level
      robust statistics (moments, IQR, MAD, tail percentiles, Gini coefficients, frame-to-frame differences), then
      take the mean, minimum and maximum across days. NPVH adds interaction features such as phonation efficiency
      (CPP/f0), closure-periodicity ratios and harmonic stability ratios, and needs stronger class weighting and
      regularization.


      **3. MIL branch.** Each subject is a bag of at most 24 windows of 12 s. For PVH, each 50 ms frame has 131
      channels: 12 acoustic channels, an energy channel, a missingness indicator and 117 day-level statistics broadcast
      over time. The 12 s window holds complete phonatory phrases at manageable cost; the 24-window cap balances
      coverage and training stability across subjects with different recording lengths.


      - Encoder: a 1D convolutional stem and four residual blocks with squeeze-and-excitation (SE), giving a 256-d
      embedding per window. SE recalibrates channel responses, which matters for heterogeneous accelerometer channels.

      - Pooling: gated attention weights the windows into one subject vector.

      - Head: a three-layer MLP (LayerNorm, dropout 0.3) trained with class-weighted binary cross-entropy plus a
      focal-loss term.


      **4. Stacking.** Both branches give out-of-fold (OOF) probabilities under 5-fold stratified GroupKFold by
      subject, so all days of a subject stay in one fold. For NPVH, a quantile transform to a uniform distribution
      corrects calibration drift between folds. A logistic regression with balanced class weights takes the two
      probabilities, their absolute difference and their product.'
    text_ko: '**1. 프레임 필터링.** 기기가 켜진 상태에서 기록된 유성음·비노래 프레임만 남기고, 채널별 진폭 이상치를 제거하며(강건 z-점수), 결측값은 0과 이진 지시 변수로 표시해
      실제 0과 센서 누락을 구분합니다.


      **2. CatBoost 분기.** 음향 채널과 IBIF 채널마다, 여러 마스크 조건에서 일 단위 강건 통계(적률, IQR, MAD, 꼬리 백분위수, 지니 계수, 프레임 간 차이)를 계산하고,
      날짜에 걸쳐 평균·최솟값·최댓값을 취합니다. NPVH에는 발성 효율(CPP/f0), 폐쇄-주기성 비, 배음 안정성 비 같은 상호작용 특징을 더하고, 클래스 가중치와 정규화를 더 강하게 줍니다.


      **3. MIL 분기.** 대상자 한 명을 12 s 윈도 최대 24개로 이루어진 bag으로 봅니다. PVH에서는 50 ms 프레임마다 채널이 131개입니다. 음향 채널 12개, 에너지 채널
      1개, 결측 지시 변수 1개, 그리고 일 단위 통계 117개를 시간 축으로 펼친 것입니다. 12 s 윈도는 발성 구절 하나를 온전히 담으면서 계산량을 감당할 수 있는 길이이고, 윈도 24개
      상한은 기록 길이가 다른 대상자들 사이에서 커버리지와 학습 안정성의 균형을 맞춥니다.


      - 인코더: 1D 합성곱 stem과 squeeze-and-excitation(SE)이 들어간 잔차 블록 4개로 윈도마다 256차원 임베딩을 만듭니다. 채널별 반응을 다시 보정하는 SE는 이질적인
      가속도계 채널에 중요합니다.

      - 풀링: gated attention이 윈도마다 가중치를 주어 대상자 벡터 하나로 모읍니다.

      - 헤드: 3층 MLP(LayerNorm, dropout 0.3)를 클래스 가중 이진 교차 엔트로피와 focal loss 항으로 학습합니다.


      **4. 스태킹.** 두 분기는 대상자 기준 5-fold stratified GroupKFold로 out-of-fold(OOF) 확률을 냅니다. 그래서 한 대상자의 모든 날짜는 같은 fold에
      들어갑니다. NPVH에서는 확률을 균등 분포로 바꾸는 분위수 변환으로 fold 간 보정 편차를 바로잡습니다. 클래스 가중치를 균형 있게 준 로지스틱 회귀가 두 확률, 두 확률의 절댓값 차이,
      두 확률의 곱을 받아 최종 판단을 합니다.'
  - h: Results
    h_ko: 결과
    text: '**Official test set:** PVH AUC 0.891 (3rd place) and NPVH AUC 0.861 (1st place, tied with VascoASR).


      **OOF cross-validation on the training split** (table below, 95% bootstrap intervals):


      - The stacked model beats both single branches on both tasks.

      - PVH: the stacked interval [0.850, 0.917] lies entirely above the MIL-only interval [0.797, 0.872].

      - NPVH: the stacked and CatBoost intervals overlap, and the mean gain over CatBoost alone is 0.006.

      - Ablations (same splits): dropping the day-level statistics from the MIL input, the missingness indicators
      or the quantile normalization each lowers NPVH AUC, by 0.014 to 0.031. A CNN–LSTM baseline reaches 0.764 (PVH)
      and 0.673 (NPVH).'
    text_ko: '**공식 테스트 세트:** PVH AUC 0.891(3위), NPVH AUC 0.861(VascoASR 팀과 공동 1위)입니다.


      **학습 분할 OOF 교차 검증** (아래 표, 95% 부트스트랩 구간):


      - 스태킹 모델은 두 과제 모두에서 두 분기 단독보다 높습니다.

      - PVH: 스태킹 모델의 구간 [0.850, 0.917]이 MIL 단독 구간 [0.797, 0.872]보다 전부 위에 있습니다.

      - NPVH: 스태킹 모델과 CatBoost의 구간이 겹치고, CatBoost 단독 대비 평균 이득은 0.006입니다.

      - 구성 요소 제거 실험(같은 분할): MIL 입력의 일 단위 통계, 결측 지시 변수, 분위수 정규화 중 하나를 빼면 NPVH AUC가 각각 0.014에서 0.031만큼 떨어집니다. CNN–LSTM
      베이스라인은 0.764(PVH), 0.673(NPVH)입니다.'
    table: 1
  - h: My role
    h_ko: 내 역할
    text: 'This is Kiran Yerpude''s project: the system, the experiments and the paper are Kiran''s work, and I
      list it here as work I supervised.


      - **Kiran Yerpude** (first author): built the system and wrote the paper

      - **Seunggyu Jeong** (me, second author): supervising role

      - **Seong-Eun Kim** (our advisor): corresponding author


      We competed as SeoulTech-Medisensing, a joint SEOULTECH and MediSensing team.'
    text_ko: '이 프로젝트는 Kiran Yerpude의 프로젝트입니다. 시스템, 실험, 논문 모두 Kiran의 작업이며, 저는 제가 지도한 작업으로 여기에 소개합니다.


      - **Kiran Yerpude** (제1저자): 시스템을 만들고 논문을 썼습니다

      - **정승규** (저, 제2저자): 지도 역할

      - **김성은** (지도교수): 교신저자


      팀은 SEOULTECH와 MediSensing이 함께한 SeoulTech-Medisensing이라는 이름으로 참가했습니다.'
  - h: Takeaways and limits
    h_ko: 배운 점과 한계
    text: '- **The branches split the work as intended.** In the ablations, the MIL branch helps PVH most and the
      tabular branch dominates NPVH; the paper reads this as the two branches mirroring the two disorders.

      - **The deep branch adds little AUC.** The paper claims no large gain over CatBoost alone. The deep branch''s
      value is complementary: calibration stability, and an attention map over the segments that drive each decision.

      - **NPVH is harder.** With about 20% positives and high intra-class diversity, its calibration is weaker:
      at predicted probabilities of 0.8–0.9, the observed positive rate only reaches 0.3–0.5. PVH predictions follow
      the diagonal closely.

      - **Next steps named in the paper:** multi-task PVH/NPVH models, subject-adaptive modeling for NPVH, and validation
      on independent groups.'
    text_ko: '- **두 분기는 의도한 대로 일을 나눴습니다.** 구성 요소 제거 실험에서 MIL 분기는 PVH에 가장 크게 기여하고, 표 형식 분기는 NPVH 성능을 주도합니다. 논문은 이를
      두 분기가 두 장애의 특성을 반영한 결과로 봅니다.

      - **딥러닝 분기가 더하는 AUC는 작습니다.** 논문은 CatBoost 단독 대비 큰 이득을 주장하지 않습니다. 딥러닝 분기의 가치는 보완적입니다. 보정을 안정시키고, 각 판단을 이끈 구간을
      보여 주는 어텐션 맵을 줍니다.

      - **NPVH가 더 어렵습니다.** 양성이 약 20%이고 클래스 내 다양성이 커서 보정이 약합니다. 예측 확률 0.8–0.9 구간에서 실제 양성 비율은 0.3–0.5에 그칩니다. PVH 예측은
      대각선을 잘 따릅니다.

      - **논문이 밝힌 다음 단계:** PVH/NPVH 다중 과제 모델, NPVH를 위한 대상자 적응형 모델링, 독립된 집단에서의 검증입니다.'
