      app built under the Pre-Startup Package. I planned the app and led its AI. The app walks parents
      through each recording step by step, from keeping the child calm to where to hold the phone on the
      chest, with a breathing prompt and countdown before it records each site for 10 seconds.
    text_ko: 연구용 시제품과 별개로, 아이메딕은 2024년 예비창업패키지로 만든 메디센싱의 첫 제품(소비자용 앱)이기도 합니다. 저는 앱 기획과 AI를 맡았습니다.
      앱은 아이를 진정시키는 것부터 휴대폰을 가슴 어디에 대야 하는지까지 단계별로 안내하고, 숨쉬기 안내와 카운트다운 뒤에 부위마다 10초씩 녹음합니다.
