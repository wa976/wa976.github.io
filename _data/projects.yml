      with PCSL, which pulls each patient's embeddings together and pushes patients apart, and GPAL, which
      aligns patient centroids to a global centroid.
    caption_ko: PAFA 개요. BEATs 인코더의 출력은 분류기(교차 엔트로피)와 프로젝터로 들어갑니다. 프로젝터는 각 환자의 임베딩을 모으고 환자끼리는 떨어뜨리는 PCSL,
      그리고 환자 중심을 전역 중심에 정렬하는 GPAL로 학습합니다.
