- slug: pdscl-itccscc2024
  title: Patient Domain Supervised Contrastive Learning for Lung Sound Classification Using Mobile Phone
  short: PD-SCL
  venue: ITC-CSCC 2024
  year: 2024
  authors: '**Seunggyu Jeong**, Seong-Eun Kim'
  role: First author
  tagline: Contrastive learning across patients and recording devices lets stethoscope data help classify
    smartphone lung recordings, reaching an 86.3% normal/abnormal score.
  problem: Smartphone microphones could make lung sound assessment possible outside in-person visits,
    but phone recordings differ in audio style from electronic stethoscope recordings, and recordings
    also vary from patient to patient. Phone data are scarce, so a model should learn from the much larger
    stethoscope data without being hurt by this device gap.
  approach: PD-SCL adds a supervised contrastive loss to a fine-tuned Audio Spectrogram Transformer (AST).
    Features are L2-normalized and compared by temperature-scaled dot products; positive pairs share the
    same label but come from different patients or different recording devices, and pairs with different
    labels are negatives. The total loss is cross-entropy plus 0.5 times the PD-SCL loss (temperature
    0.5). It is compared with AST fine-tuned on phone data only, AST fine-tuned on the combined data,
    and domain adversarial training (DAT). Data are pediatric lung sounds recorded by medical professionals
    at a children's hospital in Seoul with a 3M Littmann digital stethoscope (8,724 recordings, 342 patients)
    and an iPhone (2,701 recordings, 63 patients), classified as normal vs. abnormal (crackle, wheeze
    or both).
  result: Under 5-fold cross-validation that trains on stethoscope and phone recordings and validates
    on phone recordings only, PD-SCL reaches Sp 89.9%, Se 82.7% and a score (mean of Sp and Se) of 86.3%,
    compared with 84.1% for AST on phone data only, 83.9% for AST on the combined data and 83.7% for DAT.
    The abstract summarizes this as a 2.4% improvement over the original AST model. Its ROC AUC is 0.90,
    versus 0.86 to 0.89 for the baselines.
  type:
  - research
  tagline_ko: 환자와 녹음 기기를 가로지르는 대조 학습으로 청진기 데이터가 스마트폰 폐음 분류에 도움이 되게 했고, 정상/이상 score 86.3%를 기록했습니다.
  role_ko: 제1저자
  problem_ko: 스마트폰 마이크는 대면 진료가 아닌 상황에서도 폐음 평가를 가능하게 할 수 있지만, 스마트폰 녹음은 전자 청진기 녹음과 오디오 스타일이 다르고 환자마다도 차이가
    있습니다. 스마트폰 데이터는 적기 때문에, 모델은 이 기기 간 차이에 영향을 받지 않으면서 훨씬 많은 청진기 데이터로부터 배워야 합니다.
  approach_ko: PD-SCL은 미세 조정한 Audio Spectrogram Transformer(AST)에 지도 대조 손실(supervised contrastive loss)을
    더합니다. 특징은 L2 정규화한 뒤 온도로 스케일한 내적으로 비교합니다. 양성 쌍은 라벨이 같으면서 환자나 녹음 기기가 다른 쌍이고, 라벨이 다른 쌍은 음성 쌍입니다. 전체 손실은
    교차 엔트로피에 PD-SCL 손실의 0.5배를 더한 값입니다(온도 0.5). 비교 대상은 스마트폰 데이터만으로 미세 조정한 AST, 합친 데이터로 미세 조정한 AST, 도메인
    적대적 학습(DAT)입니다. 데이터는 서울의 한 어린이병원에서 의료진이 3M Littmann 디지털 청진기(8,724건, 환자 342명)와 iPhone(2,701건, 환자 63명)으로
    녹음한 소아 폐음이며, 정상과 이상(수포음(crackle), 천명음(wheeze), 또는 둘 다)으로 분류합니다.
  result_ko: 청진기와 스마트폰 녹음으로 학습하고 스마트폰 녹음으로만 검증하는 5-fold 교차 검증에서, PD-SCL은 Sp 89.9%, Se 82.7%, score(Sp와
    Se의 평균) 86.3%를 기록했습니다. 비교 모델은 스마트폰 데이터만 쓴 AST 84.1%, 합친 데이터로 학습한 AST 83.9%, DAT 83.7%였습니다. 논문 초록은
    이를 원래 AST 모델 대비 2.4% 향상으로 요약합니다. ROC AUC는 0.90이고, 베이스라인은 0.86~0.89였습니다.
  metrics:
  - value: 86.3%
    label: Score (mean of Sp and Se) on smartphone recordings, 5-fold CV
    label_ko: 스마트폰 녹음 Score (Sp와 Se의 평균), 5-fold CV
  - value: +2.4%
    label: Score gain over AST fine-tuned on the combined data (83.9%)
    label_ko: 합친 데이터로 미세 조정한 AST(83.9%) 대비 Score 상승
  - value: '0.90'
    label: ROC AUC (baselines 0.86-0.89)
    label_ko: ROC AUC (베이스라인 0.86-0.89)
