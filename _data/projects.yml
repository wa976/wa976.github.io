  blog:
  - h: TL;DR
    h_ko: 한 줄 요약
    text: Almost all labelled lung-sound data comes from electronic stethoscopes, and models trained on it fail
      on smartphone audio. I made that data usable for a phone model with a fixed filter that moves phone audio
      into the stethoscope band and a **directional MixStyle** module that makes stethoscope spectrograms look phone-like
      during training. The resulting Audio Spectrogram Transformer (AST) reached **AUROC 0.911** in patient-level
      5-fold cross-validation and **0.862** on an external smartphone-only cohort of 48 children.
    text_ko: 라벨이 달린 폐음 데이터는 거의 전부 전자 청진기로 녹음한 것이고, 이 데이터로 학습한 모델은 스마트폰 소리에서 제대로 동작하지 않습니다. 저는 스마트폰 오디오를 청진기 대역으로
      옮기는 고정 필터와, 학습 중에 청진기 스펙트로그램을 스마트폰처럼 바꾸는 **방향성 MixStyle**로 이 데이터를 스마트폰 모델에 쓸 수 있게 만들었습니다. 이렇게 학습한 Audio Spectrogram
      Transformer(AST)는 환자 단위 5-fold 교차 검증에서 **AUROC 0.911**, 아동 48명의 스마트폰 전용 외부 코호트에서 **0.862**를 기록했습니다.
  - h: The problem
    h_ko: 문제
    text: 'The goal: a parent records a child''s lung sounds with a phone between clinic visits, and a model flags
      the recordings a doctor should hear. The blocker is data: in our cohort, **611 children** were recorded with
      an electronic stethoscope (12,380 clips), but only **147** also with a smartphone (1,235 clips).


      The stethoscope data does not transfer on its own:


      - Trained only on it, the model scored F1 0.850 on stethoscope tests but **0.034** on the external phone cohort,
      with **1.85%** sensitivity. It called almost every phone recording normal.

      - Pooling both sources without alignment did worse than phone data alone (F1 0.708 vs 0.732).


      So the question was how to use ten times more stethoscope data without also learning what a stethoscope sounds
      like.'
    text_ko: '부모가 진료 사이사이에 아이 가슴에 휴대폰을 대고 녹음하면, 모델이 의사가 들어 봐야 할 녹음을 골라 줄 수 있습니다. 걸림돌은 데이터입니다. 저희 코호트에서 전자 청진기로 녹음한
      아이는 **611명**(12,380 클립)이었지만, 스마트폰으로도 녹음한 아이는 **147명**(1,235 클립)뿐이었습니다.


      청진기 데이터는 그대로 옮겨 쓸 수 없었습니다.


      - 청진기 데이터만으로 학습한 모델은 청진기 테스트에서 F1 0.850이었지만, 스마트폰 외부 코호트에서는 **0.034**, 민감도 **1.85%**였습니다. 스마트폰 녹음을 거의 모두 정상으로
      판정한 것입니다.

      - 정렬 없이 두 데이터를 합치면 스마트폰 데이터만 쓸 때보다 오히려 나빴습니다(F1 0.708 대 0.732).


      그래서 질문은 이것이었습니다. 열 배 많은 청진기 데이터를 쓰면서, 청진기 소리의 특성까지 배우지 않게 하려면 어떻게 해야 하는가.'
  - h: Key idea
    h_ko: 핵심 아이디어
    text: 'Measure the gap, remove what a filter can remove, and let training handle the rest.


      Each paired phone clip was recorded right after the stethoscope clip, at the same site on the same child,
      so the differences come mostly from the device. On 110 paired normal recordings:


      - spectral centroid: **77 Hz** (stethoscope) vs **959 Hz** (phone)

      - spectral bandwidth: **142 Hz** vs **2,509 Hz**

      - spectral roll-off (85%): **130 Hz** vs **1,358 Hz**


      The gap sits on the frequency axis, so a low-pass filter comes first and per-frequency statistics, which MixStyle
      manipulates, handle the rest. Because the phone is the deployment target, the mixing runs one way: label-rich
      stethoscope data is pushed toward the phone style.'
    text_ko: '차이를 먼저 재고, 필터로 없앨 수 있는 것은 없애고, 남은 것은 학습으로 다룹니다.


      쌍 녹음은 같은 아이의 같은 부위를 청진기로 녹음한 직후 스마트폰으로 녹음했기 때문에, 두 녹음의 차이는 대부분 기기에서 옵니다. 정상 쌍 녹음 110건을 비교하면 다음과 같습니다.


      - 스펙트럼 중심(spectral centroid): 청진기 **77 Hz**, 스마트폰 **959 Hz**

      - 스펙트럼 대역폭: **142 Hz** 대 **2,509 Hz**

      - 스펙트럼 롤오프(85%): **130 Hz** 대 **1,358 Hz**


      차이가 주파수 축에 몰려 있으므로 저역 통과 필터를 먼저 쓰고, 남은 차이는 MixStyle이 다루는 주파수별 통계로 줄입니다. 배포 대상이 스마트폰이라 섞는 방향도 한쪽으로 정했습니다. 라벨이
      풍부한 청진기 데이터를 스마트폰 스타일 쪽으로 옮깁니다.'
    fig: 2
  - h: How it works
    h_ko: 방법
    text: '**Smartphone-specific preprocessing (SSP).** A zero-phase, eighth-order Butterworth low-pass filter at
      1,000 Hz, then downsampling from 48,000 Hz to the stethoscope''s 4,000 Hz. The phone''s centroid, bandwidth
      and roll-off fell to 152, 164 and 259 Hz: still different from the stethoscope (P < .001), but close. Both
      sources then become 128-bin log-Mel spectrograms at 16,000 Hz, with SpecAugment.


      **Directional MixStyle.** I normalize each frequency bin of a stethoscope spectrogram by its own mean and
      standard deviation, then rescale it with a blend of its statistics and those of a smartphone spectrogram from
      the same batch. The blend weight is drawn from a Beta(α, α) distribution.


      - Only stethoscope samples are mixed, with probability p; phone samples pass through unchanged.

      - It is applied once, before patch embedding. I compared several insertion points and kept this one on validation
      performance.

      - A grid over {0.3, 0.5, 0.7} picked p = 0.5 and α = 0.5.


      Fed with target statistics, MixStyle (built for domain generalization) becomes a domain-adaptation method
      with no extra network or adversarial loss, which suits a small pediatric cohort.


      **Backbone.** A pretrained AST (Patch16, 12 layers, linear head on `[CLS]`), fully fine-tuned: 87.19M parameters
      and 40.05 GMACs per 4-second input.'
    text_ko: '**스마트폰 전용 전처리(SSP).** 1,000 Hz 영위상(zero-phase) 8차 Butterworth 저역 통과 필터를 거친 뒤, 48,000 Hz에서 청진기와 같은
      4,000 Hz로 다운샘플링합니다. 그러면 스마트폰의 스펙트럼 중심·대역폭·롤오프가 152, 164, 259 Hz로 내려옵니다. 청진기와의 차이는 여전히 유의했지만(P < .001) 훨씬 가까워졌습니다.
      이후 두 데이터 모두 16,000 Hz의 128-bin log-Mel 스펙트로그램으로 바꾸고 SpecAugment를 적용합니다.


      **방향성 MixStyle.** 청진기 스펙트로그램을 주파수 bin마다 자기 평균과 표준편차로 정규화한 뒤, 자기 통계와 같은 배치의 스마트폰 스펙트로그램 통계를 섞은 값으로 다시 스케일합니다.
      섞는 비율은 Beta(α, α) 분포에서 뽑습니다.


      - 청진기 샘플만 확률 p로 섞고, 스마트폰 샘플은 그대로 통과시킵니다.

      - 패치 임베딩 앞에 한 번 적용합니다. 여러 삽입 위치를 비교해 검증 성능이 가장 좋은 이 위치를 골랐습니다.

      - {0.3, 0.5, 0.7} 그리드에서 p = 0.5, α = 0.5를 골랐습니다.


      원래 도메인 일반화용인 MixStyle에 타깃 통계를 넣으면 추가 네트워크도 적대적 손실도 없는 도메인 적응 방법이 됩니다. 작은 소아 코호트에 잘 맞는 성질입니다.


      **백본.** 사전학습된 AST(Patch16, 12층, `[CLS]` 위 선형 헤드)를 전체 미세조정했습니다. 파라미터 87.19M, 4초 입력당 40.05 GMACs입니다.'
  - h: Experiments and results
    h_ko: 실험과 결과
    text: '**Data.** Children aged 0–6 at Woori Children''s Hospital in Seoul (October 2021 – December 2023), recorded
      at four sites with the phone directly on the chest wall. Two board-certified pediatricians labelled each ~3-second
      clip as normal, crackle, wheeze or both (Cohen''s κ = 0.82); the abnormal labels were merged for screening.
      External cohort: 48 children recorded only with the same iPhone model at a second site, 434 clips.


      **Protocol.** Patient-stratified 5-fold cross-validation, with all of a child''s clips from both devices in
      one fold so nothing leaks across devices; each fold''s best checkpoint then runs on the external cohort. F1,
      AUROC and AUPRC are the primary endpoints because the data is imbalanced.


      **Results.** The proposed setup was the best smartphone model on all three endpoints, internally and externally,
      with statistically significant gains over phone-only training and naive pooling. In the t-SNE plot, naive
      pooling leaves the two devices in separate clusters; the proposed model makes them overlap.


      Ablation (F1, primary / external):


      - neither component: 0.708 / 0.630

      - SSP only: 0.783 / 0.703

      - MixStyle only: 0.691 / 0.672

      - both: 0.802 / 0.744


      SSP did most of the work. MixStyle on top added a modest, not always significant gain, clearest in external
      AUPRC (0.779 → 0.822).


      Other checks:


      - DANN or Deep CORAL instead of MixStyle: external F1 0.688 and 0.735 (vs 0.744).

      - Child speech, whisper and clothing rub from AudioSet at 20 dB SNR: external F1 **0.583**, vs 0.453 for a
      fine-tuned CNN10 and 0.236 for naive pooling.

      - Calibration of the 5-fold ensemble on the external cohort: ECE ≈ 0.06, Brier score 0.13.'
    text_ko: '**데이터.** 2021년 10월부터 2023년 12월까지 서울 우리아이들병원에서 0–6세 아이들을 네 부위에서 녹음했고, 스마트폰은 흉벽에 바로 댔습니다. 소아청소년과 전문의
      2명이 약 3초 클립마다 정상·수포음·천명음·둘 다 중 하나로 라벨을 달았고(Cohen''s κ = 0.82), 선별을 위해 이상 라벨을 하나로 합쳤습니다. 외부 코호트는 두 번째 기관에서
      같은 아이폰 기종으로만 녹음한 아이 48명, 434 클립입니다.


      **평가 방식.** 환자 단위로 층화한 5-fold 교차 검증을 썼고, 한 아이의 클립은 두 기기 것 모두 같은 fold에 넣어 기기 간 누수를 막았습니다. 각 fold의 최적 체크포인트는
      외부 코호트에 그대로 적용했습니다. 클래스가 불균형해서 F1, AUROC, AUPRC를 주 지표로 삼았습니다.


      **결과.** 제안 방법은 내부·외부 모두 세 지표에서 가장 좋은 스마트폰 모델이었고, 스마트폰 단독 학습과 단순 병합 대비 개선은 통계적으로 유의했습니다. t-SNE를 보면 단순 병합에서는
      두 기기의 특징이 따로 모이고, 제안 방법에서는 서로 겹칩니다.


      구성 요소 제거 실험(F1, 주 코호트 / 외부):


      - 둘 다 없음: 0.708 / 0.630

      - SSP만: 0.783 / 0.703

      - MixStyle만: 0.691 / 0.672

      - 둘 다: 0.802 / 0.744


      이득의 대부분은 SSP에서 나왔습니다. SSP 위에 MixStyle을 더한 이득은 작고 항상 유의하지는 않았으며, 외부 AUPRC에서 가장 뚜렷했습니다(0.779 → 0.822).


      그 밖의 점검:


      - MixStyle 대신 DANN, Deep CORAL: 외부 F1 각각 0.688, 0.735 (제안 방법 0.744)

      - AudioSet의 아이 말소리·속삭임·옷 스침 잡음을 20 dB SNR로 더했을 때 외부 F1 **0.583** (미세조정한 CNN10 0.453, 단순 병합 0.236)

      - 외부 코호트에서 5-fold 앙상블의 보정: ECE ≈ 0.06, Brier score 0.13'
    fig: 3
    table: 1
  - h: What I did
    h_ko: 내가 한 일
    text: '- Measured the device gap on the paired recordings and turned it into the preprocessing design.

      - Designed directional MixStyle and tuned its placement and hyperparameters.

      - Built the data pipeline, including patient-level folds that keep both devices of a child together.

      - Ran every experiment: training setups, ablation, CNN and linear-probe baselines, DANN and Deep CORAL, the
      noise stress test and calibration.

      - Wrote the paper as first author and released the code ([GitHub](https://github.com/wa976/smartphone-lung-sound-DA)).

      - The method is also registered as Korean patent KR 10-2949975.


      The data comes from a joint clinical study with Woori Children''s Hospital (IRB 2021-0017-02): my co-authors
      Sungwoo Nam and Seongkwan Jung are pediatricians there, two board-certified pediatricians labelled the clips,
      and Prof. Seong-Eun Kim advised the work.'
    text_ko: '- 쌍 녹음으로 기기 차이를 측정하고, 그 결과로 전처리를 설계했습니다.

      - 방향성 MixStyle을 설계하고 삽입 위치와 하이퍼파라미터를 정했습니다.

      - 한 아이의 두 기기 녹음을 같은 fold로 묶는 환자 단위 분할을 포함해 데이터 파이프라인을 만들었습니다.

      - 학습 설정 비교, 구성 요소 제거, CNN·linear probe 베이스라인, DANN·Deep CORAL 비교, 잡음 스트레스 테스트, 보정 분석까지 모든 실험을 돌렸습니다.

      - 제1저자로 논문을 썼고 코드를 공개했습니다([GitHub](https://github.com/wa976/smartphone-lung-sound-DA)).

      - 이 방법은 한국 특허 KR 10-2949975로도 등록되어 있습니다.


      데이터는 우리아이들병원과의 공동 임상연구(IRB 2021-0017-02)에서 나왔습니다. 공저자 Sungwoo Nam, Seongkwan Jung 선생님은 이 병원 소아청소년과 전문의이고,
      라벨은 소아청소년과 전문의 2명이 달았습니다. 김성은 교수가 연구를 지도했습니다.'
  - h: Takeaways and limits
    h_ko: 배운 점과 한계
    text: '- **Fix the signal first.** A filter chosen from paired measurements gave most of the gain; mixing styles
      without it lowered in-domain F1.

      - **Simple statistics fit this shift.** With little target data and a gap on the frequency axis, statistic
      mixing generalized better than adversarial domain confusion (DANN).

      - **Built for decision support.** The calibrated output is meant to flag children for a clinician''s review,
      with a threshold chosen for the workflow.


      Limits stated in the paper: a small external cohort; clinic recordings only, with home noise simulated; one
      phone model; session-level labels, so no per-site results; and only Deep CORAL and DANN as domain-adaptation
      baselines. Next steps are caregiver recordings at home with quality control, larger multi-site cohorts, and
      multiple phone models with device-conditional normalization, short calibration recordings or test-time adaptation.'
    text_ko: '- **신호부터 맞춥니다.** 쌍 측정을 근거로 고른 필터 하나가 이득의 대부분을 만들었습니다. 이 정렬 없이 스타일만 섞으면 주 코호트 F1이 오히려 떨어졌습니다.

      - **이번 기기 차이에는 단순한 통계가 맞았습니다.** 타깃 데이터가 적고 차이가 주파수 축에 몰린 상황에서는, 통계를 섞는 쪽이 적대적 학습(DANN)보다 잘 일반화했습니다.

      - **의사결정 보조용으로 설계했습니다.** 보정된 확률로 의사가 먼저 볼 아이를 골라 주고, 임계값은 쓰임새에 맞춰 정합니다.


      논문에 적은 한계: 외부 코호트가 작고, 녹음은 모두 진료실에서 했으며 가정 잡음은 시뮬레이션으로만 확인했습니다. 스마트폰은 한 기종뿐이고, 라벨이 세션 단위라 부위별 성능은 없습니다. 도메인
      적응 비교 대상도 Deep CORAL과 DANN뿐입니다. 다음 단계는 보호자가 집에서 녹음한 데이터와 품질 관리, 더 큰 다기관 코호트, 그리고 여러 기종에서의 평가(기기 조건부 정규화, 짧은
      보정 녹음, test-time adaptation)입니다.'
