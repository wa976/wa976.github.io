- slug: neckvibe-interspeech2026
  title: Attention-Based Multiple Instance Learning with Tabular Stacking for Ambulatory Detection of
    PVH and NPVH
  short: NeckVibe Challenge
  venue: INTERSPEECH 2026
  year: 2026
  authors: Kiran Yerpude, **Seunggyu Jeong**, Seong-Eun Kim
  role: Co-author (supervising role)
  award: 1st place (tied) NPVH · 3rd place PVH
  tagline: Subject-level detection of two voice disorders from week-long neck-accelerometer recordings
    by stacking a CatBoost tabular model with attention-based MIL.
  problem: Phonotraumatic (PVH) and non-phonotraumatic (NPVH) vocal hyperfunction are voice disorders
    caused by excessive laryngeal muscle activity; PVH comes with vocal-fold lesions, NPVH does not. The
    NeckVibe Challenge provides multi-day neck-surface accelerometer recordings of daily voice use from
    582 individuals, with labels only at the subject level, so the informative short segments inside long,
    noisy recordings are not marked.
  approach: Frame-level features at 50 ms are filtered to voiced, non-singing, device-on frames, amplitude
    outliers are removed, and missing values are encoded with explicit indicators. A tabular branch trains
    CatBoost on day-level robust statistics aggregated per subject, with extra interaction features for
    NPVH. A multiple-instance learning branch treats each subject as a bag of up to 24 windows of 12 s,
    encodes each window with a 1D residual network with squeeze-and-excitation into a 256-dimensional
    embedding, and pools the windows with gated attention. Out-of-fold probabilities from both branches
    (quantile-normalized for NPVH), their absolute difference and their product feed a logistic-regression
    stacking classifier, using 5-fold stratified GroupKFold by subject throughout.
  result: On the challenge's held-out test set, the system reached AUC 0.891 for PVH (Task 1, rank 3)
    and AUC 0.861 for NPVH (Task 2, rank 1, tied with another team on the official leaderboard). In out-of-fold
    cross-validation on the official training split, the stacked model reached AUC 0.885 (95% CI 0.850-0.917)
    for PVH and 0.757 (95% CI 0.697-0.810) for NPVH, above either branch alone. The authors note that
    the gain over CatBoost alone is small and describe the deep branch's value as complementary.
  venue_long: INTERSPEECH 2026 · NeckVibe Challenge
  award_short: 1st (tied) · 3rd
  note: 'Team SEOULTECH × MediSensing. Kiran Yerpude led the system and the paper; Seunggyu Jeong had
    a supervising role. Data: NeckVibe Challenge dataset.'
  type:
  - research
  short_ko: NeckVibe 챌린지
  tagline_ko: 일주일 동안의 목 가속도계 기록에서 두 가지 음성 장애를 대상자 단위로 탐지합니다. CatBoost 표 형식 모델과 어텐션 기반 MIL을 스태킹했습니다.
  role_ko: 공저자 (지도 역할)
  award_ko: NPVH 공동 1위 · PVH 3위
  award_short_ko: 공동 1위 · 3위
  note_ko: '팀 SEOULTECH × MediSensing. 시스템과 논문은 Kiran Yerpude가 주도했고, 저(정승규)는 지도 역할을 맡았습니다. 데이터: NeckVibe
    Challenge 데이터셋.'
  problem_ko: 발성 외상성(phonotraumatic, PVH) 음성 과기능과 비발성 외상성(non-phonotraumatic, NPVH) 음성 과기능(vocal hyperfunction)은
    후두 근육의 과도한 활동으로 생기는 음성 장애입니다. PVH는 성대 병변을 동반하고 NPVH는 동반하지 않습니다. NeckVibe 챌린지는 582명의 일상 음성 사용을 목 표면
    가속도계로 여러 날 기록한 데이터를 제공합니다. 다만 라벨은 대상자 단위로만 있어서, 길고 잡음이 많은 기록 안에서 정보가 담긴 짧은 구간은 표시되어 있지 않습니다.
  approach_ko: 50 ms 단위 프레임 특징 중 유성음이면서 노래가 아니고 기기가 켜져 있는 프레임만 남기고, 진폭 이상치를 제거하며, 결측값은 명시적인 지시 변수로 표시합니다.
    표 형식(tabular) 분기는 일 단위 강건 통계를 대상자별로 집계해 CatBoost를 학습하며, NPVH에는 상호작용 특징을 추가로 씁니다. 다중 인스턴스 학습(MIL) 분기는
    대상자 한 명을 12 s 길이 윈도 최대 24개로 이루어진 bag으로 보고, 각 윈도를 squeeze-and-excitation이 들어간 1D 잔차 네트워크로 256차원 임베딩에
    인코딩한 뒤 gated attention으로 윈도들을 풀링합니다. 두 분기의 out-of-fold 확률(NPVH는 분위수 정규화), 두 확률의 절댓값 차이, 두 확률의 곱을 로지스틱
    회귀 스태킹 분류기에 넣습니다. 전 과정에서 대상자 기준 5-fold stratified GroupKFold를 씁니다.
  result_ko: 챌린지의 별도 테스트 세트(held-out)에서 PVH는 AUC 0.891(Task 1, 3위), NPVH는 AUC 0.861(Task 2, 1위, 공식 리더보드에서
    다른 팀과 공동)을 기록했습니다. 공식 학습 분할에서의 out-of-fold 교차 검증에서는 스태킹 모델이 PVH AUC 0.885(95% CI 0.850-0.917), NPVH
    AUC 0.757(95% CI 0.697-0.810)로 각 분기 단독보다 높았습니다. 저자들은 CatBoost 단독 대비 이득이 작다는 점을 밝히고, 딥러닝 분기의 가치를 보완적인
    것으로 설명합니다.
  venue_long_ko: INTERSPEECH 2026 · NeckVibe 챌린지
  metrics:
  - value: '0.861'
    label: Official test AUC, NPVH detection (Task 2), rank 1 (tied)
