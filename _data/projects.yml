- slug: dcase2026-task3-semantic-acoustic-imaging
  title: An Equirectangular Energy Field with Per-Location Class Coverage for Semantic Acoustic Imaging
  short: Semantic acoustic imaging
  venue: DCASE 2026 · Task 3
  year: 2026
  authors: '**Seunggyu Jeong**, Seong-Eun Kim'
  role: First author, team lead
  award: 2nd place, Track A (team ranking)
  topics:
  - spatial-audio
  - challenge
  tagline: Audio-only semantic acoustic imaging with a PanoFormer energy field on the sphere and direction-of-arrival
    class coverage; 2nd of 5 teams in Track A.
  problem: 'DCASE 2026 Task 3 asks systems to turn four-channel first-order spatial audio into semantic
    acoustic images: for every 0.1 s frame, a set of instances, each a soft energy footprint on the 360°
    × 180° equirectangular sphere with one of thirteen sound classes. Systems are scored by mask mean
    average precision (mask mAP) with a MACRO average over classes, so every spurious connected component
    is a false positive and a class with no predictions counts as zero rather than being skipped.'
  approach: The problem is split into localization and classification. A fixed, distilled acoustic-imaging
    front-end (UpLAM, built on latent acoustic mapping) maps the recording to a nine-band 9 × 180 × 360
    energy image, and PanoFormer, an equirectangular transformer with azimuth-circular padding, replaces
    the baseline's ResNet/FPN decoder to regress a dense energy field without seam artefacts at the azimuth
    wrap. Instances are connected components of the field thresholded at 0.5, initially scored by peak
    energy. Each instance takes the class of the nearest per-class direction of arrival predicted by PSELDNets
    (fine-tuned with a thirteen-class ACCDOA head) within a per-class assignment radius, so all thirteen
    classes can be labelled, and a temporal-persistence re-ranking sets the detection confidences. The
    four submitted systems differ only in this class branch.
  result: On the development set, the primary system (PSELDNets coverage, 80-pixel radius) reaches a MACRO
    mask mAP of 0.0515, against 0.0003 for the official baseline; replacing the planar decoder with the
    equirectangular field alone raises mask mAP from about 0.017 to 0.0394 at a fixed operating point.
    On the official evaluation set the team ranked 2nd of 5 teams in Track A (audio-only); its best-ranked
    system (the same coverage system at a 40-pixel radius) scored Macro mAP 0.0662 and Macro Pearson r
    0.2765. The official ranking combines the ranks of mask mAP and Pearson r.
  venue_long: DCASE 2026 Challenge, Task 3 Track A (audio-only), technical report
  award_short: 2nd place
  thumb_text: Spherical sound maps from 4-channel audio
