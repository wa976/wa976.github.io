- slug: dcase2025-task1-device-aware-kd
  title: Adaptive Knowledge Distillation using a Device-Aware Teacher for Low-Complexity Acoustic Scene
    Classification
  short: Device-aware distillation
  venue: DCASE 2025 · Task 1
  year: 2025
  authors: '**Seunggyu Jeong**, Seong-Eun Kim'
  role: First author
  tagline: Knowledge distillation from a device-aware PaSST teacher ensemble into a low-complexity CP-MobileNet,
    followed by device-specific fine-tuning.
  problem: DCASE 2025 Task 1 asks for acoustic scene classification of 1-second clips from 10 scene classes
    (TAU Urban Acoustic Scenes 2025 Mobile) under strict complexity limits of at most 128 kB of parameters
    and 30 million multiply-accumulate operations, while staying robust across recording devices, including
    devices never seen in training. A new rule in the 2025 edition allows the device label to be used
    at test time.
  approach: A CP-MobileNet student (32 base channels, expansion rate 3, channel multiplier 2.3) is trained
    by knowledge distillation from two PaSST teachers whose soft predictions are averaged. One teacher
    is trained with cross-entropy only; the other, a "generalization expert", adds a Device-Aware Feature
    Alignment (DAFA) loss adapted from the authors' earlier patient-aware feature alignment work on lung
    sound classification. DAFA combines a Device Cohesion-Separation Loss (intra-device scatter divided
    by inter-device scatter) with a Global Device Alignment Loss that pulls each device centroid toward
    the global centroid. Freq-MixStyle and Mixup are used during training; after 500 epochs of distillation,
    the student is fine-tuned for 100 more epochs on each of the six known devices, so a device-specific
    model is selected at inference.
  result: On the official development split, the final system reaches 57.93% accuracy, up from 54.61%
    after distillation alone (+3.32 points overall); device-specific fine-tuning improves every known
    device (A, B, C, S1, S2, S3) by +2.16 to +8.24 points. In the teacher-configuration ablation, the
    cross-entropy + DAFA teacher pair ties the cross-entropy-only pair at 60.73% overall but is higher
    on seen (57.73%) and unseen (58.35%) devices. On the official evaluation set, the best system (Jeong_SEOULTECH_task1_2)
    reached 57.9% accuracy (53.0% on unknown devices).
  venue_long: DCASE 2025 Challenge, Task 1, technical report
  thumb_text: Scene classification under 128 kB
  type:
  - research
  short_ko: 기기 인지 지식 증류
  tagline_ko: 기기를 고려한 PaSST 교사 앙상블에서 저복잡도 CP-MobileNet으로 지식 증류를 하고, 이어서 기기별 미세 조정을 합니다.
  role_ko: 제1저자
  thumb_text_ko: 128 kB 이하 음향 장면 분류
  problem_ko: DCASE 2025 Task 1은 1초 길이 클립을 10개 장면 클래스(TAU Urban Acoustic Scenes 2025 Mobile)로 나누는 음향 장면
    분류 과제입니다. 파라미터 128 kB 이하, 곱셈-누산 연산(MAC) 30M회 이하라는 엄격한 복잡도 제한을 지키면서, 학습 때 본 적 없는 기기를 포함한 여러 녹음 기기에서
    강건해야 합니다. 2025년 대회에는 테스트 때 기기 라벨을 쓸 수 있다는 규칙이 새로 생겼습니다.
  approach_ko: CP-MobileNet 학생 모델(기본 채널 32, 확장 비율 3, 채널 배수 2.3)을 PaSST 교사 두 개의 soft 예측을 평균한 값으로 지식 증류해
    학습합니다. 한 교사는 교차 엔트로피만으로 학습하고, 다른 교사인 "일반화 전문가"는 Device-Aware Feature Alignment(DAFA) 손실을 더합니다. DAFA는
    저자들이 앞서 폐음 분류에서 제안한 환자 인지 특징 정렬(patient-aware feature alignment)을 기기에 맞게 옮긴 것입니다. DAFA는 Device Cohesion-Separation
    Loss(기기 내 산포를 기기 간 산포로 나눈 값)와, 각 기기 중심을 전역 중심 쪽으로 당기는 Global Device Alignment Loss를 결합합니다. 학습에는 Freq-MixStyle과
    Mixup을 씁니다. 500 epoch 동안 증류한 뒤에는 학습 데이터에 있는 기기 6개 각각에 대해 학생 모델을 100 epoch 더 미세 조정하고, 추론 때 해당 기기의 모델을
    고릅니다.
  result_ko: 공식 개발 분할에서 최종 시스템의 정확도는 57.93%로, 증류만 했을 때의 54.61%보다 높았습니다(전체 +3.32 포인트). 기기별 미세 조정은 학습 데이터에
    있는 기기(A, B, C, S1, S2, S3) 모두에서 정확도를 +2.16~+8.24 포인트 올렸습니다. 교사 구성에 대한 구성 요소 제거 실험(ablation)에서 교차 엔트로피
    + DAFA 교사 쌍은 전체 정확도 60.73%로 교차 엔트로피만 쓴 쌍과 같았지만, 학습 때 본 기기(57.73%)와 보지 못한 기기(58.35%)에서는 더 높았습니다. 공식
    평가 세트에서 가장 좋은 시스템(Jeong_SEOULTECH_task1_2)은 정확도 57.9%(학습 때 보지 못한 기기 53.0%)를 기록했습니다.
  venue_long_ko: DCASE 2025 챌린지 Task 1, 기술 보고서
  metrics:
  - value: 57.93%
    label: Development-set accuracy of the final system (after device-specific fine-tuning)
    label_ko: 최종 시스템의 개발 세트 정확도 (기기별 미세 조정 후)
