    caption_ko: 기기별 미세 조정(DSFT) 전후의 녹음 기기별 개발 세트 정확도(%). 미세 조정은 학습 데이터에 있는 기기 6개에만 적용하므로 S4-S6은 변화가 없습니다.
  links:
    arxiv: https://arxiv.org/abs/2509.09262
    inference_code: https://github.com/wa976/dcase2025_task1_inference
    results: https://dcase.community/challenge2025/task-low-complexity-acoustic-scene-classification-with-device-information-results
  figures: []
  blog:
  - h: TL;DR
    h_ko: 한 줄 요약
    text: 'DCASE 2025 Task 1 is acoustic scene classification on a tight budget: 1-second clips, 10 scenes, at most
      128 kB of parameters and 30 million multiply-accumulates (MACs), and robustness to recording devices never
      seen in training. New this year, the device label is available at test time.


      My system has two stages:


      1. **Distill** a CP-MobileNet student from two PaSST teachers: a plain cross-entropy teacher and a "generalization
      expert" trained with my Device-Aware Feature Alignment (DAFA) loss.

      2. **Specialize** the student with device-specific fine-tuning (DSFT) on each of the six known devices, and
      pick the matching model at inference.


      Results: **57.93%** development accuracy (54.61% before DSFT) and **57.9%** on the official evaluation set
      for my best submission.'
    text_ko: 'DCASE 2025 Task 1은 빠듯한 예산 안에서 하는 음향 장면 분류입니다. 1초 클립을 10개 장면으로 나누되, 파라미터 128 kB 이하, 곱셈-누산 연산(MAC) 3,000만
      회 이하를 지키고, 학습 때 본 적 없는 녹음 기기에서도 버텨야 합니다. 올해는 테스트 때 기기 라벨을 쓸 수 있다는 규칙이 새로 생겼습니다.


      제 시스템은 두 단계입니다.


      1. **증류:** PaSST 교사 두 개에서 CP-MobileNet 학생 모델로 지식을 증류합니다. 한 교사는 교차 엔트로피만으로 학습했고, 다른 교사인 "일반화 전문가"는 제가 만든 Device-Aware
      Feature Alignment(DAFA) 손실을 더해 학습했습니다.

      2. **특화:** 학습 데이터에 있는 기기 6개 각각에 대해 기기별 미세 조정(DSFT)을 하고, 추론 때 해당 기기의 모델을 고릅니다.


      결과: 개발 세트 정확도 **57.93%**(DSFT 전 54.61%), 공식 평가 세트에서 가장 좋은 제출 시스템 **57.9%**입니다.'
  - h: The task
    h_ko: 과제
    text: '- **Data:** TAU Urban Acoustic Scenes 2025 Mobile, 1-second clips from 10 urban scenes recorded with
      a variety of devices (A, B, C, S1–S6).

      - **Budget:** at most 128 kB of parameters and 30 million MACs.

      - **Devices:** six devices (A, B, C, S1, S2, S3) appear in the training data; S4–S6 do not, and the model
      still has to handle them.

      - **New rule:** the device label may be used at test time.


      The report frames this as two challenges at once: strict complexity limits, and generalization to both seen
      and unseen devices. Strong models such as PaSST serve as teachers; the deployed student has to fit the budget.'
    text_ko: '- **데이터:** TAU Urban Acoustic Scenes 2025 Mobile. 10개 도시 장면의 1초 클립을 여러 기기(A, B, C, S1–S6)로 녹음했습니다.

      - **예산:** 파라미터 128 kB 이하, MAC 3,000만 회 이하.

      - **기기:** 학습 데이터에는 기기 6개(A, B, C, S1, S2, S3)만 있고 S4–S6은 없지만, 모델은 이 기기들도 처리해야 합니다.

      - **새 규칙:** 테스트 때 기기 라벨을 쓸 수 있습니다.


      보고서는 이 과제를 두 가지 도전이 겹친 것으로 봅니다. 엄격한 복잡도 제한과, 본 기기와 처음 보는 기기 모두에 대한 일반화입니다. PaSST 같은 강한 모델은 교사로 쓰고, 실제로 배포하는
      학생 모델은 예산 안에 들어야 합니다.'
  - h: Key idea
    h_ko: 핵심 아이디어
    text: 'Build robustness first, then specialize.


      - A teacher trained to organize its feature space by device should hand the student a more device-robust signal.
      DAFA carries over my earlier lung-sound work on patient-aware feature alignment (PAFA), with recording devices
      in place of patients.

      - Once the student is robust, the test-time device label lets me fine-tune one copy per known device. Clips
      from unseen devices use the general distilled model.'
    text_ko: '먼저 강건성을 만들고, 그다음에 특화합니다.


      - 특징 공간을 기기 기준으로 정리하도록 학습한 교사라면 학생에게 기기 변화에 더 강한 신호를 넘겨줄 것입니다. DAFA는 제가 앞서 폐음 분류에서 만든 환자 인지 특징 정렬(PAFA)을 환자
      대신 녹음 기기에 적용한 것입니다.

      - 학생이 강건해진 뒤에는 테스트 시 기기 라벨을 이용해 아는 기기마다 사본을 하나씩 미세 조정합니다. 처음 보는 기기의 클립은 증류한 모델을 그대로 씁니다.'
  - h: How it works
    h_ko: 방법
    text: '**Student.** CP-MobileNet with 32 base channels, expansion rate 3 and channel multiplier 2.3, built from
      depth-wise separable convolutions with a constrained receptive field. The official results page lists the
      submitted model at 61,148 parameters (122,296 bytes) and 26.06M MACs, inside both limits. (The report text
      quotes about 128K parameters and 29.5M MACs.)


      **Teachers.** Two AudioSet-pretrained PaSST models: a baseline trained with cross-entropy only, and a generalization
      expert trained with cross-entropy plus the two DAFA terms, each weighted 0.01.


      **DAFA** has two parts:


      - *Device Cohesion-Separation Loss (DCSL):* intra-device scatter divided by inter-device scatter. Minimizing
      it tightens each device cluster and pushes the clusters apart, which keeps device-specific information in
      a structured form.

      - *Global Device Alignment Loss (GDAL):* the mean squared distance from each device centroid to the global
      centroid of the batch. It tethers all device clusters to one anchor so the feature space does not fragment,
      which matters for unseen devices.


      **Distillation.** The two teachers'' logits are averaged into one target. The student loss is a weighted sum
      of hard-label cross-entropy and temperature-scaled KL divergence to that target, with temperature 2 and weight
      0.98 on the distillation term. Freq-MixStyle (swapping frequency-band statistics between samples) and Mixup
      are used for augmentation. Training runs 500 epochs with Adam, batch size 128, peak learning rate 5e-4, linear
      warmup and cosine decay.


      **DSFT.** After distillation, the student is fine-tuned for 100 more epochs on each of the six known devices
      at learning rate 1e-5. At inference, the device label picks the matching model.'
    text_ko: '**학생 모델.** 기본 채널 32, 확장 비율 3, 채널 배수 2.3인 CP-MobileNet으로, 깊이별 분리 합성곱(depth-wise separable convolution)과
      제한된 수용 영역으로 이루어집니다. 공식 결과 페이지에 따르면 제출 모델은 파라미터 61,148개(122,296 바이트), MAC 2,606만 회로 두 제한을 모두 지킵니다. (보고서 본문에는
      파라미터 약 128K개, MAC 2,950만 회로 적혀 있습니다.)


      **교사 모델.** AudioSet으로 사전 학습한 PaSST 두 개입니다. 하나는 교차 엔트로피만으로 학습한 기본 교사이고, 다른 하나는 교차 엔트로피에 DAFA 두 항을 각각 가중치 0.01로
      더해 학습한 일반화 전문가입니다.


      **DAFA**는 두 부분으로 이루어집니다.


      - *Device Cohesion-Separation Loss(DCSL):* 기기 내 산포를 기기 간 산포로 나눈 값입니다. 이를 최소화하면 기기별 군집은 촘촘해지고 군집끼리는 멀어져, 기기별
      정보가 구조를 갖춘 채로 남습니다.

      - *Global Device Alignment Loss(GDAL):* 각 기기 중심과 배치 전체 중심 사이의 평균 제곱 거리입니다. 모든 기기 군집을 하나의 기준점에 묶어 특징 공간이 조각나지
      않게 하며, 처음 보는 기기에 일반화하는 데 중요합니다.


      **증류.** 두 교사의 logit을 평균해 목표 하나를 만듭니다. 학생의 손실은 정답 라벨에 대한 교차 엔트로피와, 이 목표에 대한 온도 조절 KL 발산의 가중합입니다. 온도는 2, 증류
      항의 가중치는 0.98입니다. 증강으로는 샘플 사이에 주파수 대역 통계를 바꿔 넣는 Freq-MixStyle과 Mixup을 씁니다. 학습은 Adam, 배치 크기 128, 최대 학습률 5e-4,
      선형 warmup과 코사인 감쇠로 500 epoch 돌립니다.


      **DSFT.** 증류가 끝나면 학습 데이터에 있는 기기 6개 각각에 대해 학습률 1e-5로 100 epoch 더 미세 조정합니다. 추론 때는 기기 라벨로 해당 기기의 모델을 고릅니다.'
  - h: Results
    h_ko: 결과
    text: '**Teacher configurations.** The report''s Table 1 (accuracy %, captioned as teacher accuracy, so not
      comparable with the student numbers below):


      - Single teachers: cross-entropy 59.78 and 59.22 (two seeds), DAFA 59.00 overall

      - CE + CE ensemble: 60.73 overall, 57.41 seen, 58.31 unseen

      - CE + DAFA ensemble: 60.73 overall, 57.73 seen, 58.35 unseen


      Both ensembles beat every single teacher. They tie overall, and the CE + DAFA pair is higher on seen and unseen
      devices, so I chose it for the final system.


      **Device-specific fine-tuning.** DSFT raises overall development accuracy from 54.61% to 57.93% (+3.32 points)
      and improves every known device, from +2.16 points (S1) to +8.24 points (B).


      **Official evaluation.** My best submission, Jeong_SEOULTECH_task1_2, reached 57.9% accuracy (95% CI 57.6–58.1)
      and 53.0% on unknown devices. The other submission reached 56.9%.'
    text_ko: '**교사 구성.** 보고서의 Table 1입니다(정확도 %, 표 제목이 교사 정확도이므로 아래 학생 모델 숫자와는 비교하지 않습니다).


      - 단일 교사: 교차 엔트로피 59.78, 59.22(시드 2개), DAFA 59.00 (전체)

      - CE + CE 앙상블: 전체 60.73, 본 기기 57.41, 보지 못한 기기 58.31

      - CE + DAFA 앙상블: 전체 60.73, 본 기기 57.73, 보지 못한 기기 58.35


      두 앙상블 모두 어떤 단일 교사보다 높습니다. 전체 정확도는 같고 CE + DAFA 쌍이 본 기기와 보지 못한 기기에서 더 높아서, 최종 시스템에 이 쌍을 골랐습니다.


      **기기별 미세 조정.** DSFT로 개발 세트 전체 정확도가 54.61%에서 57.93%로 올랐고(+3.32%p), 학습 데이터에 있는 기기 모두가 +2.16%p(S1)에서 +8.24%p(B)까지
      올랐습니다.


      **공식 평가.** 가장 좋은 제출 시스템 Jeong_SEOULTECH_task1_2는 정확도 57.9%(95% CI 57.6–58.1), 처음 보는 기기에서 53.0%를 기록했습니다. 다른
      제출 시스템은 56.9%였습니다.'
    table: 1
  - h: What I did
    h_ko: 내가 한 일
    text: 'I was first author; my advisor Seong-Eun Kim is the corresponding author.


      - Adapted my patient-aware feature alignment loss from lung sound classification into DAFA for recording devices,
      and trained the generalization-expert teacher with it

      - Built the two-teacher distillation pipeline and configured the CP-MobileNet student to fit the complexity
      limits

      - Ran the teacher-configuration study and chose the ensemble by its seen- and unseen-device accuracy

      - Added device-specific fine-tuning to use the new test-time device label

      - Wrote the technical report (arXiv 2509.09262) and released the inference code'
    text_ko: '저는 제1저자이고, 지도교수인 김성은 교수이 교신저자입니다.


      - 폐음 분류에서 만든 환자 인지 특징 정렬 손실을 녹음 기기용 DAFA로 옮기고, 이것으로 일반화 전문가 교사를 학습했습니다

      - 교사 두 개를 쓰는 증류 파이프라인을 만들고, CP-MobileNet 학생 모델을 복잡도 제한에 맞게 구성했습니다

      - 교사 구성 비교 실험을 하고, 본 기기와 보지 못한 기기의 정확도를 기준으로 앙상블을 골랐습니다

      - 새로 허용된 테스트 시 기기 라벨을 쓰기 위해 기기별 미세 조정 단계를 더했습니다

      - 기술 보고서(arXiv 2509.09262)를 쓰고 추론 코드를 공개했습니다'
  - h: Takeaways and limits
    h_ko: 배운 점과 한계
    text: '- **DAFA paid off only inside the ensemble.** As a single teacher, the DAFA expert was slightly below
      a plain cross-entropy teacher (59.00% vs 59.78% overall). In the ensemble it raised seen and unseen accuracy
      at the same overall accuracy, by 0.32 and 0.04 points over the CE + CE pair.

      - **DSFT only helps the devices it has seen.** It lifts all six known devices and leaves S4–S6 where the distilled
      model put them.

      - **Two stages, two jobs.** The report concludes that the specialized teacher pair drives unseen-device generalization
      and fine-tuning adapts to known devices.

      - **The device gap remains.** On the evaluation set, accuracy on unknown devices (53.0%) is below the overall
      57.9%.'
    text_ko: '- **DAFA는 앙상블 안에서만 효과가 있었습니다.** 단일 교사로는 DAFA 전문가가 교차 엔트로피 교사보다 약간 낮았습니다(전체 59.00% 대 59.78%). 앙상블에서는
      전체 정확도를 유지한 채 본 기기와 보지 못한 기기의 정확도를 CE + CE 쌍보다 각각 0.32%p, 0.04%p 높였습니다.

      - **DSFT는 본 적 있는 기기에만 도움이 됩니다.** 학습 데이터에 있는 기기 6개는 모두 올렸지만, S4–S6은 증류한 모델의 결과 그대로입니다.

      - **두 단계가 각자 다른 일을 합니다.** 보고서는 특화된 교사 쌍이 처음 보는 기기에 대한 일반화를 이끌고, 미세 조정이 아는 기기에 대한 적응을 맡는다고 결론짓습니다.

      - **기기 간 격차는 남아 있습니다.** 평가 세트에서 처음 보는 기기의 정확도(53.0%)는 전체 정확도 57.9%보다 낮습니다.'
