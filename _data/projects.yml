- slug: jbhi-2026-smartphone-lung-sound
  title: Smartphone-Based Detection of Abnormal Lung Sounds Using Domain-Adaptive Deep Learning
  short: Smartphone lung-sound screening
  venue: IEEE JBHI 2026
  year: 2026
  authors: '**Seunggyu Jeong**, Sungwoo Nam, Seongkwan Jung, Seong-Eun Kim'
  role: First author
  tagline: Detects abnormal pediatric lung sounds from smartphone recordings by adapting stethoscope data;
    AUROC 0.911 internally and 0.862 on an external smartphone-only cohort.
  problem: Electronic stethoscopes have made large labeled lung-sound datasets and deep learning possible,
    but they are costly and impractical for everyday care at home. Smartphones are everywhere and have
    sensitive microphones, so they could support home auscultation and remote patient monitoring, yet
    labeled smartphone recordings are scarce and their acoustics differ from medical-grade stethoscopes.
    Models trained on stethoscope data degrade on smartphone recordings, and naively pooling the two sources
    is ineffective because of the acoustic mismatch.
  approach: 'We recruited 611 children aged 0–6 years at Woori Children''s Hospital; 147 of them also
    provided immediate-sequence paired recordings with an electronic stethoscope (3M Littmann CORE) and
    a smartphone (iPhone 13) at the same four auscultation sites, and two board-certified pediatricians
    labeled every clip (Cohen''s κ = 0.82). Analysis of the pairs suggested that the device gap lies mainly
    along the frequency axis, so smartphone audio is first aligned to the stethoscope band with a zero-phase
    eighth-order Butterworth low-pass filter at 1,000 Hz and downsampling from 48,000 Hz to 4,000 Hz.
    An Audio Spectrogram Transformer (AST) is then trained on both sources with a directional MixStyle
    module applied once before patch embedding: it blends per-frequency mean and standard-deviation statistics
    from smartphone spectrograms into stethoscope spectrograms, so the abundant labeled stethoscope data
    look "smartphone-like". The task is binary screening of normal versus abnormal (crackles and/or wheezes),
    evaluated with patient-stratified 5-fold cross-validation and on an independent smartphone-only cohort
    of 48 children from a different clinical site.'
  result: On smartphone recordings in the primary cohort, the proposed method reached F1 0.802, AUROC
    0.911 and AUPRC 0.890, versus 0.732 / 0.862 / 0.806 for a smartphone-only model and 0.708 / 0.834
    / 0.796 for naive pooling. On the external smartphone-only cohort it reached F1 0.744, AUROC 0.862
    and AUPRC 0.822, while a stethoscope-only model failed to generalize (F1 0.034). Ablation showed that
    smartphone-specific preprocessing drove most of the gain (primary F1 0.708 → 0.783), with directional
    MixStyle adding a smaller, not always significant refinement that was most visible in external AUPRC
    (0.779 → 0.822). With added child-speech, whisper and clothing-rub noise at 20 dB SNR, external F1
    stayed at 0.583 versus 0.236 for naive pooling, and the 5-fold ensemble was well calibrated (ECE ≈
    0.06, Brier score 0.13).
  venue_long: IEEE Journal of Biomedical and Health Informatics, 2026 (Early Access)
  type:
  - research
  short_ko: 스마트폰 폐음 선별
  tagline_ko: 청진기 데이터를 스마트폰에 맞게 적응시켜, 스마트폰으로 녹음한 소아 폐음에서 이상음을 탐지합니다. 내부 평가 AUROC 0.911, 스마트폰 전용 외부 코호트
    AUROC 0.862입니다.
  role_ko: 제1저자
  problem_ko: 전자 청진기 덕분에 라벨이 달린 대규모 폐음 데이터셋과 딥러닝을 쓸 수 있게 되었지만, 전자 청진기는 비싸고 가정에서 일상적으로 쓰기 어렵습니다. 스마트폰은
    어디에나 있고 마이크 감도도 높아 가정 청진과 원격 환자 모니터링에 쓰일 수 있습니다. 하지만 라벨이 달린 스마트폰 녹음은 드물고, 음향 특성도 의료용 청진기와 다릅니다. 청진기
    데이터로 학습한 모델은 스마트폰 녹음에서 성능이 떨어지고, 두 데이터를 단순히 합쳐 학습하는 방식(naive pooling)도 음향 차이 때문에 효과가 없습니다.
  approach_ko: 우리아이들병원에서 0–6세 아동 611명을 모집했습니다. 이 중 147명은 같은 청진 부위 네 곳에서 전자 청진기(3M Littmann CORE)와 스마트폰(iPhone
    13)으로 곧바로 이어서 녹음한 쌍 녹음도 제공했고, 소아청소년과 전문의 2명이 모든 클립에 라벨을 달았습니다(Cohen's κ = 0.82). 쌍 녹음을 분석한 결과 기기 간
    차이는 주로 주파수 축에 있는 것으로 보였습니다. 그래서 먼저 스마트폰 오디오에 1,000 Hz 영위상(zero-phase) 8차 Butterworth 저역 통과 필터를 적용하고
    48,000 Hz에서 4,000 Hz로 다운샘플링해 청진기 대역에 맞춥니다. 그다음 두 데이터로 Audio Spectrogram Transformer(AST)를 학습하며, 패치
    임베딩 앞에 방향성 MixStyle(directional MixStyle) 모듈을 한 번 적용합니다. 이 모듈은 스마트폰 스펙트로그램의 주파수별 평균·표준편차 통계를 청진기 스펙트로그램에
    섞어, 라벨이 풍부한 청진기 데이터를 "스마트폰처럼" 보이게 만듭니다. 과제는 정상과 이상(수포음(crackle) 및/또는 천명음(wheeze))을 가르는 이진 선별이며, 환자
    단위로 층화한 5-fold 교차 검증과, 다른 의료기관에서 모은 아동 48명의 독립된 스마트폰 전용 코호트로 평가했습니다.
  result_ko: 주 코호트의 스마트폰 녹음에서 제안 방법은 F1 0.802, AUROC 0.911, AUPRC 0.890을 기록했습니다. 스마트폰 데이터만 쓴 모델은 0.732
    / 0.862 / 0.806, 단순 병합은 0.708 / 0.834 / 0.796이었습니다. 스마트폰 전용 외부 코호트에서는 F1 0.744, AUROC 0.862, AUPRC
    0.822를 기록했고, 청진기 데이터만 쓴 모델은 일반화하지 못했습니다(F1 0.034). 구성 요소 제거 실험(ablation)에서는 스마트폰 전용 전처리가 이득의 대부분을
    만들었습니다(주 코호트 F1 0.708 → 0.783). 방향성 MixStyle은 그보다 작고 항상 유의하지는 않은 개선을 더했으며, 그 효과는 외부 AUPRC에서 가장 뚜렷했습니다(0.779
    → 0.822). 아이 말소리, 속삭임, 옷 스침 잡음을 20 dB SNR로 더했을 때 외부 F1은 0.583으로 유지되었고, 단순 병합은 0.236이었습니다. 5-fold 앙상블은
    보정(calibration)도 잘 되어 있었습니다(ECE ≈ 0.06, Brier score 0.13).
  metrics:
  - value: '0.911'
    label: AUROC on smartphone recordings, primary cohort (patient-stratified 5-fold CV)
    label_ko: 주 코호트 스마트폰 녹음 AUROC (환자 단위 층화 5-fold CV)
  - value: '0.862'
    label: AUROC on an independent smartphone-only external cohort (48 children)
    label_ko: 독립된 스마트폰 전용 외부 코호트 AUROC (아동 48명)
  - value: '147'
    label: children with immediate-sequence paired stethoscope and smartphone recordings (of 611 enrolled)
    label_ko: 청진기·스마트폰 연속 쌍 녹음을 제공한 아동 수 (등록 611명 중)
