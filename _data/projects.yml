- slug: pafa-interspeech2025
  title: 'Patient-Aware Feature Alignment for Robust Lung Sound Classification: Cohesion-Separation and
    Global Alignment Losses'
  short: PAFA
  venue: INTERSPEECH 2025
  year: 2025
  authors: '**Seunggyu Jeong**, Seong-Eun Kim'
  role: First author
  topics:
  - lung-sound
  - generalization
  tagline: Two patient-aware training losses that keep each patient's lung-sound features distinct yet
    globally aligned, reaching an ICBHI Score of 64.84% (4-class).
  problem: Patients with the same diagnosis can produce very different lung sounds because of anatomy,
    disease severity and recording environment. When a global objective such as cross-entropy dominates
    training, embeddings of distinctive patients tend to collapse into a few large class clusters ("feature
    collapse"), so models work on well-represented profiles but neglect outlier patients. Adding demographic
    metadata such as age or gender cannot fully account for these acoustic differences.
  approach: PAFA adds a projection head next to the classification head of an AudioSet-pretrained BEATs
    backbone and trains it with two patient-aware losses on top of cross-entropy. The Patient Cohesion-Separation
    Loss (PCSL), inspired by Fisher's linear discriminant analysis, minimizes the ratio of intra-patient
    scatter to inter-patient centroid dispersion, pulling a patient's embeddings together while pushing
    different patients apart. The Global Patient Alignment Loss (GPAL) draws every patient centroid toward
    the batch's global centroid so the feature space does not fragment. Patient identifiers are used only
    to compute these losses; the projection head is removed after training and only the classifier is
    used at inference.
  result: On the ICBHI 2017 dataset (official 60/40 split, mean of five seeds), BEATs + PAFA reaches an
    ICBHI Score of 64.84% for 4-class and 72.08% for 2-class classification, 1.35 and 1.32 points above
    the BEATs cross-entropy baseline; the paper reports these as state-of-the-art Scores on both tasks
    among the compared methods. PAFA also improves the Score with CNN6 (57.46% to 57.87%) and AST (60.93%
    to 62.19%) backbones, and removing either loss lowers the 4-class Score to 63.92% (without PCSL) or
    63.88% (without GPAL).
  metrics:
  - value: 64.84%
    label: ICBHI Score, 4-class (BEATs + PAFA)
  - value: 72.08%
    label: ICBHI Score, 2-class (BEATs + PAFA)
  - value: '+1.35'
    label: Score points over the BEATs + CE baseline, 4-class
  - value: '+1.32'
    label: Score points over the BEATs + CE baseline, 2-class
