<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% if page.title and page.title != site.title %}
      <title>{{ page.title }} · {{ site.title }}</title>
    {% else %}
      <title>{{ site.title }}</title>
    {% endif %}
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑‍💻</text></svg>" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip" href="#main">Skip to content</a>
    {% include nav.html %}
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <div class="wrap">
        <span>© {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
        <span class="muted">Last updated {{ site.time | date: "%b %Y" }}</span>
      </div>
    </footer>
    <div class="lightbox" hidden><img alt="" /><p></p></div>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
